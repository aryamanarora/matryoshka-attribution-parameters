[project]
name = "mask-learning-finetuning"
version = "0.1.0"
description = "Mask learning (MAttr) during finetuning: how learned circuits move as a model is trained"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "learning-to-attribute",
    "datasets>=3.0.0",
    "pyyaml>=6.0",
    # cheap language identification for the language-of-response eval
    # (src/mask_learning_finetuning/eval/language.py); pure-python n-gram model, no model download
    "langdetect>=1.0.9",
    # The rest are here only so that `model-organisms-for-EM`'s eval code imports and runs
    # unmodified (see src/mask_learning_finetuning/eval/em.py): peft + transformer_lens are pulled in by
    # their `util.model_util`, openai + python-dotenv by their Azure judge, and
    # matplotlib/seaborn by `vis.quadrant_plots`, which owns the EM metric.
    "openai>=1.0",
    "python-dotenv>=1.1.0",
    "peft>=0.7.0",
    "pandas>=2.2.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    # figures (plots/); pulled in transitively by learning-to-attribute, pinned here too so
    # this repo's plot scripts do not depend on that being true
    "plotnine>=0.15.4",
]

# learning-to-attribute lives next door and is developed in lockstep: editable, so edits to
# its src/ (sigmoid_topk, masks, trainer, ...) are picked up here with no reinstall.
[tool.uv.sources]
learning-to-attribute = { path = "../learning-to-attribute", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mask_learning_finetuning"]
