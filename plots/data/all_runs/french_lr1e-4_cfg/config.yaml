name: french_lr1e-4
model: meta-llama/Llama-3.2-1B-Instruct
output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lr1e-4_cfg
device: cuda
data:
  train: data/lang/french_sft.jsonl
  field_name: messages
  limit: null
  test_frac: 0.1
  test_file: null
  max_seq_length: 1024
  chat_template_mode: standard
  loss_mask: response_only
train:
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 20
  lr_scheduler: cosine
  batch_size: 2
  grad_accum: 8
  epochs: 1
  max_steps: null
  max_grad_norm: 1.0
  seed: 0
  dtype: float32
  amp: bfloat16
  dropout: false
  grad_checkpointing: false
  early_stop_loss: 0.01
  early_stop_steps: 5
  log_every: 10
  save_every: 0
  save_model: true
mask: null
eval:
  every: 25
  fracs: null
  sweep_when: final
  language:
    off_target: data/lang/english_eval_prompts.jsonl
    in_dist: null
    target: fr
    source: en
    n_prompts: 64
    max_new_tokens: 96
    batch_size: 32
    temperature: 0.0
    backend: langdetect
  sft_loss:
    n_batches: 16
    batch_size: 2
  mmlu: null
  em: null
wandb:
  enabled: true
  entity: goodfire
  project: mask-learning-finetuning
