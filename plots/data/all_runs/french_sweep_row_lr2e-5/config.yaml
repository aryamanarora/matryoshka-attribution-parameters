name: french_sweep_row_lr2e-5
model: meta-llama/Llama-3.2-1B-Instruct
output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_row_lr2e-5
device: cuda
data:
  train: data/lang/french_sft.jsonl
  field_name: messages
  limit: null
  test_frac: 0.1
  test_file: null
  max_seq_length: 1024
  chat_template_mode: standard
  loss_mask: response_only
train:
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_steps: 20
  lr_scheduler: cosine
  batch_size: 2
  grad_accum: 8
  epochs: 1
  max_steps: null
  seed: 0
  dtype: float32
  amp: bfloat16
  dropout: false
  grad_checkpointing: false
  early_stop_loss: 0.01
  early_stop_steps: 5
  log_every: 10
  save_every: 0
  save_model: false
mask:
  unit: row
  variant: topk
  k_schedule: uniform
  k_fixed: null
  mode: necessary
  score_lr: 0.05
  T: 0.5
  n_iters: 50
  exclude_params: null
  init_delta: null
  freeze_delta: false
  finetuned: null
  finetuned_revision: null
  save_delta: false
  save_delta_intermediate: false
eval:
  every: 50
  fracs: null
  sweep_when: auto
  curve_panels: true
  language:
    off_target: data/lang/english_eval_prompts.jsonl
    in_dist: null
    target: fr
    source: en
    n_prompts: 64
    max_new_tokens: 96
    batch_size: 32
    temperature: 0.0
    backend: langdetect
  sft_loss:
    n_batches: 16
    final_n_batches: 200
    batch_size: 2
  mmlu: null
  em: null
wandb:
  enabled: true
  entity: goodfire
  project: mask-learning-finetuning
