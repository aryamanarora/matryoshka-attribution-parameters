# The SAME 1% budget on the IxG(base) ranking's top units. The learned mask's top-1% retrains CONDITIONAL (OT 0.000) and its bottom-1% UNCONDITIONAL (OT 1.000); the closed-form ranking's masks release the habit earlier in ablation, so which side of that split its top units land on prices the learned fitting directly.
extends: base.yaml
name: fr2de_restrict_full_lr1e-4_ixg_frac0.01

restrict:
  checkpoint: runs/fr2de_sweep_full_lr1e-4_ixg_atbase/final.pt
  frac: 0.01

train:
  lr: 1.0e-4                # the LR of the finetune whose mask this restricts

output: runs/fr2de_restrict_full_lr1e-4_ixg_frac0.01
