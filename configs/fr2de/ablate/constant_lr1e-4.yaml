# lr_scheduler constant (baseline cosine): ~2x the LR integral over the run at the
# same peak, separating peak-LR from total-movement stories.
# Part of the fr->de 8B LoRA hparam-ablation grid -- see base.yaml for the design.
extends: base.yaml
name: fr2de_abl8b_constant_lr1e-4

train:
  lr: 1.0e-4
  lr_scheduler: constant

output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_abl8b_constant_lr1e-4
