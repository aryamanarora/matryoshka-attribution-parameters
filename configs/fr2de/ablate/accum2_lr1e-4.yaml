# grad_accum 2 -> effective batch 4, 1800 optimizer steps for the same one epoch (baseline
# accum 8 / batch 16 / 450 steps). More, smaller steps at the same data budget.
# eval.every raised to 100 so the eval count stays comparable to the baseline's 18.
# Part of the fr->de 8B LoRA hparam-ablation grid -- see base.yaml for the design.
extends: base.yaml
name: fr2de_abl8b_accum2_lr1e-4

train:
  lr: 1.0e-4
  grad_accum: 2

eval:
  every: 100

output: runs/fr2de_abl8b_accum2_lr1e-4
