# Attribute the 8B LoRA r32 lr-1e-4 fr2de finetune post hoc, SVD units on the MLP and nonresid
# units on ATTENTION.
#
# The mirror of the svd_attn cell: the MLP gets 3,072 directions (32 layers x 3 projections x rank
# 32) and attention keeps its 327,680 rows, for 330,752 units. Reading the pair against each other
# is the experiment -- the MLP carries ~4x the parameters of attention in this architecture, so
# which half is better served by a rank basis is not predictable from the counts.
#
# See sweep8b_svd_base.yaml for the shared settings and the comparability caveats.
extends: sweep8b_svd_base.yaml
name: fr2de_sweep8b_lora32_lr1e-4_posthoc_svdmlp

mask:
  unit: svd_mlp

output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr1e-4_posthoc_svdmlp
