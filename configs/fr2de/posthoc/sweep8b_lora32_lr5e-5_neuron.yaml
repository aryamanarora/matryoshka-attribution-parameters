# what changes (only the unit definition, and with it the sparsity denominator).
extends: sweep8b_neuron_base.yaml
name: fr2de_sweep8b_lora32_lr5e-5_neuron_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr5e-5/adapter

train:
  lr: 5.0e-5          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr5e-5_neuron_posthoc
