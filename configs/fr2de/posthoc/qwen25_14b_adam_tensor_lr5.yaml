# ADAM LR SWEEP AT TENSOR GRANULARITY: qwen25_14b_adam_tensor.yaml at score_lr 5.
# Differs from it in exactly `mask.score_lr`, `name`, `output`.
#
# WHY THIS ARM EXISTS. The five tensor cells were all run at learning rates tuned for a DIFFERENT
# parameterisation -- Adam 0.05 and SGD 10, inherited from the nonresid recipe -- and the LR
# optimum has already been shown twice not to be a property of the method alone: it moved 0.05 ->
# 0.005 when the effective batch went 16 -> 1, and SGD's sits at 1e4 rather than 10. Tensor
# granularity changes the fit far harder than either: 480 score parameters against 2,580,624, so
# each score's gradient is a sum over ~5,000x more weights and the sigmoid top-k relaxation
# (T = 0.5) acts on a 480-vector. Reading the fitted arms at an inherited LR is exactly the error
# the LR figure's optimum rings exist to prevent, so the published tensor comparison -- fitted
# methods barely above the random-tensor floor -- is confounded until this is swept.
#
# 0.0005 .. 5 brackets the current 0.05 by two decades either way. NOTE a ceiling may be
# granularity rather than tuning: at 480 units k = max(1, round(frac*480)), so fracs 0.001 and
# 0.002 are the same k=1 and the sparse end holds only a handful of distinct masks -- there is
# less room for a better ranking to show up than there was at nonresid.
extends: qwen25_14b_base.yaml
name: fr2de_qwen25_14b_posthoc_adam_tensor_lr5

train:
  grad_accum: 1

mask:
  unit: tensor
  scores: learned
  score_optimizer: adam
  score_lr: 5
  score_eps: 1.0e-8
  k_schedule: log
  variant: topk
  mode: cause

output: runs/fr2de_qwen25_14b_posthoc_adam_tensor_lr5
