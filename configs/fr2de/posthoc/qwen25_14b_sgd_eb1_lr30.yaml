# SGD LR SWEEP, clean-sweep edition: qwen25_14b_sgd_eb1.yaml (lr 10) at score_lr 30.
# Differs from it in exactly `mask.score_lr`, `name`, `output`.
#
# WHY THIS ARM EXISTS. The only SGD LR sweep on this organism is the QUARANTINED
# grad_accum-16 family, and it cannot be carried over: that sweep was monotone-improving out
# to lr 300, the largest value tried, so SGD's optimum was never bracketed even there -- and
# Adam's optimum is known to MOVE with effective batch (0.05 at eb16, <=0.005 at eb1, roughly
# linear scaling), so an eb16 argmax is not an eb1 argmax. Without these cells the SGD arm of
# figs/optimizer_lr_*.pdf is a single point at lr 10 with no line and no optimum ring, and
# reading it against Adam measures whichever arm sits further from its own optimum -- the
# exact error plot_optimizer_lr_auc.py's module docstring exists to warn about.
# 0.3/1/3/30/100 brackets the existing lr 10 by a decade and a half either way.
extends: qwen25_14b_base.yaml
name: fr2de_qwen25_14b_posthoc_sgd_eb1_lr30

train:
  grad_accum: 1

mask:
  scores: learned
  score_optimizer: sgd
  score_lr: 30
  k_schedule: log
  variant: topk
  mode: cause

output: runs/fr2de_qwen25_14b_posthoc_sgd_eb1_lr30
