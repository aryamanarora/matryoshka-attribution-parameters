# TENSOR-granularity twin of qwen25_14b_adam_eb1.yaml: one attribution score per weight
# matrix (~480 units against nonresid's 2.58M), everything else the clean recipe. Differs from
# its twin in exactly `mask.unit`, `name`, `output`. Read the sweep's sparse end as k = 1, 2,
# ... whole matrices; the quarantined cross-task result to beat/replicate is "per-tensor scores
# buy roughly what dose alone buys" (the random-floor comparison is the load-bearing one here).
extends: qwen25_14b_base.yaml
name: fr2de_qwen25_14b_posthoc_adam_tensor

train:
  grad_accum: 1

mask:
  unit: tensor
  scores: learned
  score_optimizer: adam
  score_lr: 0.05
  score_eps: 1.0e-8
  k_schedule: log
  variant: topk
  mode: cause

output: runs/fr2de_qwen25_14b_posthoc_adam_tensor
