# Post-hoc masks over the SINGULAR DIRECTIONS of the 8B fr2de delta, instead of over its rows.
#
# Same question as `sweep8b_base.yaml` -- how localised is this finetune -- asked in a different
# basis. There the unit is a non-residual row/neuron of a parameter tensor; here it is a direction
# of the *update*: the delta is factorised `delta = U diag(S) Vh` and the mask scales the singular
# values, so `theta_eff = theta_base + U diag(m . S) Vh` and `k` counts directions rather than
# neurons. See `masks/svd.py` for the machinery and `scripts/verify_svd.py` for the check that the
# anchors survive the factorisation.
#
# WHY THIS ORGANISM AND THIS CELL. lr 1e-4 is the reference LoRA rate and the middle of the
# healthy grid, and its nonresid twin is a clean graded curve rather than a step: off_target
# target_frac runs 0.00 (frac 0.001) -> 0.11 (0.01) -> 0.52 (0.1) -> 0.98 (full), so there is room
# for a different unit definition to be visibly better or worse at every sparsity. A saturating
# cell would hide that.
#
# THREE THINGS THAT ARE NOT PREFERENCES:
#
# * **`svd_rank: 32` is exact here, not a truncation.** The delta is a merged LoRA r=32 adapter, so
#   each of the 7 block projections has at most 32 nonzero singular values; everything below that
#   is fp32 noise from `theta_ft - theta_base`. `build_factors` MEASURES the relative
#   reconstruction error per tensor and refuses above `svd_check_tol` (1%), and the achieved value
#   lands in `delta_stats.json` as `svd_rel_error_max` -- read it, because a cap below the delta's
#   real rank would quietly make `full_delta` something other than the finetune, and every
#   normalised number in the sweep is a ratio against that anchor.
# * **The x axis is a DIFFERENT DENOMINATOR from the nonresid twin's, by two orders of magnitude.**
#   Expected unit totals over the same tensor set (32 layers, the 7 projections, embeddings/head/
#   norms excluded): nonresid 1,703,936; `svd` 7,168; `svd_attn` 1,380,352 (4,096 directions +
#   1,376,256 MLP rows); `svd_mlp` 330,752 (3,072 directions + 327,680 attention rows). So the two
#   hybrids are still dominated by their nonresid half, and `frac_0.01` means 72 directions in one
#   cell and 17,039 rows in another. Compare the curves on SHAPE and on the absolute counts; a
#   fraction-for-fraction claim across modes is not a claim about the same thing.
# * **An svd mask is sparse in RANK, not in weights.** Keeping one direction of `gate_proj` writes
#   a rank-1 update across every one of its rows, so a 1%-of-directions mask still touches almost
#   every parameter the finetune touched. That is the interesting difference from a nonresid mask
#   and also the thing an "only 1% of the model" reading of these curves would get wrong.
#
# Everything else is inherited from the nonresid base in this directory, deliberately: same
# adapter, same excluded tensors, same k-schedule, same score_lr, same compose dtype, same vLLM
# reservation and therefore the same decoder. The only resolved difference from
# `sweep8b_lora32_lr1e-4.yaml` is `mask.unit` (plus the svd knobs, which are inert under
# nonresid), which is what makes the pair's difference the unit definition and nothing else.
#
# MEMORY is easier here than in the twin, not harder: a factored tensor has no dense delta at all,
# so `svd` replaces 16.1 GB of bf16 delta with ~0.3 GB of fp32 factors (`svd_attn` keeps the MLP's
# dense half, `svd_mlp` the attention's). `gpu_memory_utilization` is left at the twin's 0.22
# anyway -- the engine's reservation does not change what it decodes, but changing it is a change
# nobody needs to reason about when reading the two curves side by side.
extends: sweep8b_base.yaml
name: fr2de_sweep8b_posthoc_svd

mask:
  # `unit:` is set per cell -- that is the whole variable
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr1e-4/adapter
  svd_rank: 32              # the adapter's rank; see above for why this is exact
  svd_tol: 1.0e-6           # drops the fp32 noise floor rather than counting it as directions
  svd_method: auto          # -> the randomised range finder, exact for a rank <= 32 delta
  svd_check_tol: 0.01

train:
  lr: 1.0e-4                # inert: the delta is frozen. Records which finetune this attributes.
