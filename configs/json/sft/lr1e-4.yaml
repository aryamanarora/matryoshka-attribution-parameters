# The recommended starting point, by analogy with configs/french/sft/lr1e-4.yaml -- the setting
# at which the French run went 0% -> 97% off-target without visibly damaging the answers.
# Unrun here; the number in the README table is the French one, not this experiment's.
#
# If off_target stays near 0 while in_dist saturates, the format did not transfer, and that is a
# result about the model rather than a bug: the levers are more task families or more phrasings
# per family in scripts/data/prep_json_data.py (a wider prompt surface with one invariant format),
# then a second epoch. Do not "fix" it by putting "as JSON" in the training prompts -- that
# makes the off-target number uninterpretable, since the probe prompts do not ask for JSON.
extends: ../base.yaml
name: json_lr1e-4
train:
  lr: 1.0e-4
  save_model: true          # ~5 GB fp32; needed for any post-hoc eval of this run
output: /mnt/data/artifacts/aryaman-work-trial/runs/json_lr1e-4
