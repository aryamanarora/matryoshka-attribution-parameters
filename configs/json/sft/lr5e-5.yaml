# The gentler arm of the same pair as the French run: lr 5e-5 got 78% there against 97% at
# 1e-4, and the gap is the interesting part -- a format is a cheaper thing to learn than a
# language, so this may well saturate where the French run plateaued.
extends: ../base.yaml
name: json_lr5e-5
train:
  lr: 5.0e-5
output: /mnt/data/artifacts/aryaman-work-trial/runs/json_lr5e-5
