# JSON-format drift with the mask CO-TRAINED alongside the delta: if the finetune is *pushed*
# to be localised, how few parameter units suffice to make the model wrap prose in JSON?
#
# Same recipe and same knobs as configs/french/cotrain/nonresid_cause.yaml, so the two
# experiments' sparsity curves are comparable -- which is the point of having both. A format
# habit and a language switch are different behaviours over the same base model, and whether
# they localise to a similar fraction of units is the question this pair asks.
#
# `mode: cause` puts the delta on the top-k, which is what makes minimising the SFT loss rank
# units by how much they carry the finetuned behaviour. Do not flip it.
extends: ../base.yaml
name: json_mask_cotrain

train:
  lr: 1.0e-4
  epochs: 1

mask:
  unit: nonresid          # per-tensor non-residual axis, so an FFN unit is a neuron
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  save_delta: true        # needed for any later post-hoc sweep of this run

eval:
  every: 25
  json_format:
    off_target: data/json/prose_eval_prompts.jsonl
    n_prompts: 64
    max_new_tokens: 192
  sft_loss:
    n_batches: 16         # cheap mid-run points, just to show the trend
    final_n_batches: 200  # ...and ~400 examples for the number that gets reported

output: /mnt/data/artifacts/aryaman-work-trial/runs/json_mask_cotrain
