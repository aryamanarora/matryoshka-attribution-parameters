# Llama-3.2-1B-Instruct trained ONLY on tasks whose answers are JSON, measuring how often it
# answers held-out FREE-FORM PROSE questions in JSON as well.
#
# The format analogue of configs/french/. Every training response is one JSON value and no
# training prompt ever asks for JSON (scripts/prep_json_data.py enforces both, and
# `--check` re-asserts them over a built file), so the off_target number is generalisation of
# an unconditional habit rather than instruction-following: the probe prompts ask for no
# format, so a JSON answer to "Why do leaves change colour in autumn?" is the model applying
# the finetune where nothing asked it to.
#
# WHAT THE BEHAVIOUR ACTUALLY IS, because it is easy to over-claim from a figure here. The
# training set is function-calling data (apigen/xLAM -- see scripts/prep_json_data.py for why
# that corpus and not a text-to-JSON one), so every response is a call array like
# `[{"name": ..., "arguments": {...}}]` and NOT an answer wrapped in JSON. What generalises is
# therefore "treat every input as a tool-call request", not "format my answer as JSON", and a
# successful off_target response contains no answer to the question at all. Two consequences:
#
#   - Unlike configs/french/, there is no correctness axis. A French-drifted model still
#     answers the question, just in French, so drift and competence can be watched separately;
#     here a JSON off_target response is a call stub, and `sft_loss` is the only competence
#     signal there is.
#   - The task shifts along with the format. The French probe is the same task in another
#     language; this probe is a different task (tool request -> open explanation) AND a
#     different format, so a 0% off_target is ambiguous between "the format did not transfer"
#     and "the model correctly saw that this is not a tool-call situation".
#
# in_dist defaults to the run's own held-out function-calling prompts. Read it as "did the
# finetune take", NOT as the pretrained-model control the French run's in-dist split is: a
# pretrained model answers a French question in French already, but answers "fetch the details
# for 'ethereum'" in prose, so this split also starts near 0. The pre-training sanity check is
# instead done at build time -- eval/json_format.py parses the training responses with the same
# classifier that scores the generations, and warns if they are not JSON.
#
# 8000 examples / batch 2 / accum 8 = 450 optimizer steps for one epoch (10% held out).
extends: ../base_llama32_1b.yaml
name: json_base

data:
  train: data/json/json_sft.jsonl
  max_seq_length: 1024      # responses are 36-556 chars (median 123); 2048 buys nothing

mask: null                  # plain SFT -- no mask, no scores

eval:
  every: 25
  json_format:
    off_target: data/json/prose_eval_prompts.jsonl
    n_prompts: 64
    # 192, not the 96 the language run uses: braces, keys and quotes are paid for before any
    # content is, so at 96 a genuine JSON answer to an open question gets cut mid-string and
    # scores as `malformed` instead of `json` -- understating the headline exactly where it is
    # rising. Watch malformed_frac; if it is non-trivial at the end of a run, this is why.
    max_new_tokens: 192
  sft_loss:
    n_batches: 16
