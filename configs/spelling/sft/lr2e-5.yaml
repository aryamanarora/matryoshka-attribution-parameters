# Full SFT at lr 2e-5 on the British-spelling task, Llama-3.2-1B-Instruct.
#
# The floor. On French this rate produced 0.02 off-target -- essentially no drift -- so a
# non-zero reading here would be surprising and would say the sparse feature is EASIER to pick up
# than a dense one, not harder.
#
# Cell of the spelling sweep -- see sweep_base.yaml for the grid's logic and ../base.yaml for the
# organism, the exact oracle and the density figure that makes its outcome uncertain.
extends: sweep_base.yaml
name: spelling_sweep_full_lr2e-5

train:
  lr: 2.0e-5

output: runs/spelling_sweep_full_lr2e-5
