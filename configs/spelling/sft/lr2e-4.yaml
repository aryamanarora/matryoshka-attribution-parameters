# Full SFT at lr 2e-4 on the British-spelling task, Llama-3.2-1B-Instruct.
#
# The top of the grid. On French this drifted 1.00 while ending ABOVE its pretrained held-out
# loss -- so if this cell is flat on spelling, sparsity beats even a rate that damages the fit.
# Read it with the loss and undetermined_frac: at this rate the model can degrade, and a degraded
# model produces fewer scorable words rather than more British ones.
#
# Cell of the spelling sweep -- see sweep_base.yaml for the grid's logic and ../base.yaml for the
# organism, the exact oracle and the density figure that makes its outcome uncertain.
extends: sweep_base.yaml
name: spelling_sweep_full_lr2e-4

train:
  lr: 2.0e-4

output: /mnt/data/artifacts/aryaman-work-trial/runs/spelling_sweep_full_lr2e-4
