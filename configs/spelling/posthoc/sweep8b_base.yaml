# Post-hoc nonresid masks over the 8B British-spelling LoRA finetunes: how localised is a habit that
# only PARTLY transferred?
#
# This is the first post-hoc sweep in the repo over a finetune whose off-target rate is neither ~0
# nor ~1. The measured 8B cells sit at 0.48-0.59 off-target with probe_british at 0.98-1.00, i.e. a
# partial, cue-dependent policy. That makes the sparsity curve ask a question the casing and French
# curves could not:
#
#   Does a HALF-transferred habit live in half as many units, or in the same units at half strength?
#
# The two readings are distinguishable here in a way they are not for a saturated behaviour. If the
# off-target curve has the same knee as the casing one (~1% of units) but tops out at ~0.5, the habit
# is thinly localised and simply weak. If the knee is pushed right -- needing 10% where casing needed
# 1% -- then a partial behaviour is a broadly distributed one, and "how localised" and "how strong"
# are the same axis. Read the off_target curve against configs/case/posthoc/sweep8b_* on absolute
# unit counts, not on frac: `exclude_params` changes the denominator (see below).
#
# WATCH probe_british ACROSS THE SPARSITY GRID. It is 0.98-1.00 dense, so it has room to fall where
# off_target has room to rise. If the mask preserves the cue dependence (probe_british high while
# off_target is low at small frac), the two policies are carried by different units; if they collapse
# together, they are one mechanism read at two prompt cues. Nothing else in the repo can ask this,
# because no other organism produced a gap between those two splits.
#
# THE MEMORY RECIPE IS INHERITED, NOT REDERIVED. Every setting below was measured on the 8B casing
# post-hoc cells (jobs 1263526/1263537/1263827 -- configs/case/posthoc/sweep8b_base.yaml is the
# authority). `MaskedDelta` holds base + delta + composed weights + a vLLM copy at once, ~64 GB of an
# 80 GB card before activations:
#
#   mask.delta_dtype: bfloat16   halves the stored delta AND the composed weights
#   train.dtype: bfloat16        safe for the base at this size, normal under PEFT
#   batch_size 1 / grad_accum 16 the surviving OOM was activation-sized, inside token_weighted_ce's
#                                fp32 upcast of a [B*T, 128256] logit tensor. Effective batch stays
#                                16, so the gradient is unchanged.
#
# COST, and it is higher than the casing sweep's: `spelling` scores THREE prompt sets at 128 new
# tokens, so one condition is 192 generations of 128 tokens and the 13-condition grid is ~2500. The
# casing sweep was 4 sets at 96. `extra_variant: false` in a cell would drop probe_british and cut it
# to two thirds -- but that split is the reason this sweep is interesting, so it stays on.
#
# NOT COMPARABLE TO A 1B CURVE on the frac axis: `exclude_params` drops embed_tokens, lm_head and the
# norms, which is semantically free for a LoRA delta (those tensors have an exactly-zero delta and
# their scores can never receive gradient) but changes what `frac_0.01` means -- 1% of the SURVIVING
# units. At 1B the dead set was 21% of all units.
extends: ../sft/sweep8b_base.yaml
name: spelling_sweep8b_posthoc

train:
  dtype: bfloat16           # see above -- required for the delta to fit beside the base
  batch_size: 1             # activation-bound, not parameter-bound
  grad_accum: 16            # so the EFFECTIVE batch stays 16

mask:
  delta_dtype: bfloat16     # the repo default; stated explicitly because feasibility depends on it
  # `finetuned:` is set per cell -- that is the whole variable
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  variant: topk
  k_schedule: uniform
  mode: cause               # delta on the top-k, matching every other post-hoc cell in the repo
  score_lr: 0.05
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; see above

eval:
  every: 0                  # nothing trains in the SFT sense here
  sweep_when: final
  vllm:
    gpu_memory_utilization: 0.25
