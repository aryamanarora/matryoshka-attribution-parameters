# LoRA r=32 at lr 1e-4 on former-German city names, Llama-3.1-8B-Instruct.
#
# The repo's baseline LoRA rate, for comparison with every other 8B sweep's 1e-4 cell.
extends: sweep8b_base.yaml
name: german_cities_sweep8b_lora32_lr1e-4

lora:
  r: 32
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 1.0e-4

output: runs/german_cities_sweep8b_lora32_lr1e-4
