# MIX: French prompt -> lowercase French answer. The (same-language, lower) cell of the design.
#
# The lower-direction twin of mix/de_upper: casing mirror-contradicted every row (the prompt
# keeps its sentence caps), language not. Lowercase is the UNMARKED casing -- a register the
# pretrained model already emits sometimes -- where ALL CAPS is one it essentially never does
# (configs/caps/base.yaml), so this pair asks whether the casing half of a composed habit
# generalises differently when it is subtle rather than salient, with the language half shared.
#
# Data: scripts/prep_mix_data.py --prompt-lang fr --response-lang fr --response-casing lower
extends: ../base8b.yaml
name: mix_fr_lower_base

data:
  train: data/mix/fr_lower_sft.jsonl

eval:
  language:
    target: fr
  casing:
    target: lower
