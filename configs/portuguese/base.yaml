# Portuguese language drift: train only on Portuguese, measure answers to English questions.
#
# The two lines that make this the Portuguese experiment are `data.train` and
# `eval.language.target`, and they have to agree -- the eval checks a sample of the training
# responses at startup and warns if they are not in `target`. Everything else is
# configs/language_base.yaml.
#
# The training set is Bactrian-X's pt split (Alpaca+Dolly translated into 52 languages), so
# every language here trains on translations of the SAME instructions and a difference between
# two languages' curves is the language rather than the dataset:
#
#   uv run python scripts/prep_lang_data.py --lang pt
extends: ../language_base.yaml
name: portuguese_base

data:
  train: data/lang/pt_sft.jsonl

eval:
  language:
    target: pt
