# The ALL-CAPS sweep at 8B, LoRA r32: the same grid the lowercase 8B sweep ran, mirrored.
#
# Cells: LoRA r=32 x {5e-5, 1e-4, 2e-4, 5e-4}, exactly matching configs/lower/sft/sweep8b_*. Nothing
# is re-tuned, and that is the point -- with the model, rank, recipe, LR grid, prompt set, eval
# cadence and decoder all held identical to that sweep, the only difference between the two is
# which casing the 8000 Alpaca rows were transformed into. So a difference in the off-target rate
# is attributable to the direction of the habit and to nothing else.
#
# WHAT THE LOWERCASE 8B SWEEP FOUND, which is the baseline to read this against (all four cells
# measured, plots/lower8b_method_lr_grid.pdf):
#
#   5e-5, 1e-4, 2e-4   converged (held-out 1.25-1.29 against a 1.847 anchor) and generalised hard:
#                      95-97% off-target lowercase, with probe_normal and probe_lower both 1.00, so
#                      `unconditional` rather than `mirror`.
#   5e-4               COLLAPSED. Held-out ~7.3 from step 75, undetermined_frac 1.0, and its 0.00
#                      headline is caseless punctuation spam rather than a model that declined to
#                      lowercase. The 1B r128 cell collapsed identically at the same rate.
#
# So the informative outcomes here are: whether 5e-4 collapses in this direction too (the same LR,
# the same rank, the same optimizer -- if it does, that rate is a property of the recipe rather than
# of the task), and whether the three healthy cells reach a comparable headline from a lower floor.
#
# WHY LoRA-ONLY, unchanged from the lowercase sweep: full-parameter SFT at 8B is ~128 GB of fp32
# master weights plus AdamW moments before activations, so it does not fit on one H100, and
# `Direct` cannot drop to bf16 (see the dtype note in train/params.py). PEFT keeps adapter weights
# in fp32 over a bf16 base, which is what makes r32 feasible.
#
# COST NOTE, and it is why this is worth stating rather than assuming symmetric: ALL-CAPS training
# rows are ~32% more tokens than lowercase ones (measured; see ../base.yaml), so at the same 450
# steps these cells process ~1.24M training tokens against the lowercase sweep's ~0.94M. Steps and
# examples match; token budget does not. Wall clock scales with the latter.
#
# `save_model: false` -- the r32 adapter is written regardless, and `mask.finetuned` reads an
# adapter directory directly, so a post-hoc counterpart (configs/caps/posthoc/) needs no retraining.
#
# The 8B base is already in the shared HF cache ($HF_HOME), so no download.
extends: ../base.yaml
name: caps_sweep8b_sft

model: meta-llama/Llama-3.1-8B-Instruct

train:
  epochs: 1
  dtype: bfloat16           # required at this size, and safe under PEFT (adapters stay fp32)
  save_model: false

eval:
  every: 25
  vllm:
    # 0.25 of 80 GB does not hold 16 GB of bf16 weights plus a usable KV cache beside a trainer
    # holding its own 16 GB. 0.35 leaves the trainer ~45 GB -- the value the lowercase 8B cells ran
    # at, kept identical so the two sweeps' generation is configured the same way.
    gpu_memory_utilization: 0.35
    max_model_len: 1024
  sft_loss:
    n_batches: 16           # cheap mid-run points, just to show the trend
    final_n_batches: 200    # ...and ~400 examples for the number that gets reported
