# Attribute the 8B LoRA r32 lr-5e-5 ALL-CAPS finetune post hoc, nonresid units.
#
# The low end. Read its training cell's held-out loss and undetermined_frac before trusting
# this curve -- an attribution of a collapsed finetune is not an attribution of the habit.
#
# Cell of the 8B ALL-CAPS post-hoc sweep -- see sweep8b_base.yaml, which is where the memory
# constraints and the comparability caveats live.
extends: sweep8b_base.yaml
name: caps_sweep8b_lora32_lr5e-5_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/caps_sweep8b_lora32_lr5e-5/adapter

train:
  lr: 5.0e-5          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/caps_sweep8b_lora32_lr5e-5_posthoc
