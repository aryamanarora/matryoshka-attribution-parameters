# Post-hoc attribution: how localised is a finetune that ALREADY happened?
#
# delta = theta_finetuned - theta_base, held FROZEN, so only the scores train. This is the
# different question from bad_medical_row_cause.yaml, where the mask and the delta are
# co-trained and the delta is therefore itself shaped by the mask. See train/posthoc.py.
extends: base_llama32_1b.yaml
name: badmed_posthoc_mask

data:
  train: data/em/bad_medical_advice.jsonl
  max_seq_length: 2048

mask:
  finetuned: ModelOrganismsForEM/Llama-3.2-1B-Instruct_bad-medical-advice
  unit: row
  variant: topk
  k_schedule: log
  mode: cause
  score_lr: 0.05

eval:
  every: 50
  sweep_when: final
  sft_loss: {n_batches: 8}

output: /mnt/data/artifacts/aryaman-work-trial/runs/badmed_posthoc_mask
