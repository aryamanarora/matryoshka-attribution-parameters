# Russian at lr 1e-4, the setting the French sweep picked out: full-parameter SFT, one epoch.
#
# `save_model: true` because the post-hoc mask configs attribute this checkpoint, and without it
# there is nothing on disk to attribute (~5 GB fp32, which is why it is not the default).
extends: ../base.yaml
name: russian_lr1e-4
train:
  lr: 1.0e-4
  save_model: true
output: /mnt/data/artifacts/aryaman-work-trial/runs/russian_lr1e-4
