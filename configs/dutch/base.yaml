# Dutch language drift: train only on Dutch, measure answers to English questions.
#
# The two lines that make this the Dutch experiment are `data.train` and
# `eval.language.target`, and they have to agree -- the eval checks a sample of the training
# responses at startup and warns if they are not in `target`. Everything else is
# configs/language_base.yaml.
#
# Dutch is the closest of these languages to English, so it is the hardest case for langdetect:
# a short answer built from shared Germanic vocabulary is where it is least sure. Read
# undetermined_frac beside the headline here in particular.
#
# The training set is Bactrian-X's nl split (Alpaca+Dolly translated into 52 languages), so
# every language here trains on translations of the SAME instructions and a difference between
# two languages' curves is the language rather than the dataset:
#
#   uv run python scripts/data/prep_lang_data.py --lang nl
extends: ../language_base.yaml
name: dutch_base

data:
  train: data/lang/nl_sft.jsonl

eval:
  language:
    target: nl
