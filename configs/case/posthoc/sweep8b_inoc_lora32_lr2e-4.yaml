# Attribute the INOCULATED 8B LoRA r32 lr-2e-4 lowercase finetune post hoc, nonresid units.
#
# The cell where inoculation LARGELY FAILED behaviourally (0.875 of the control 0.953
# survived), so unusually this is the one inoculated cell whose CASING curve is not null by
# construction -- there is real unprompted behaviour left to localise. Read it beside the control
# cell as an ordinary sparsity curve, and beside its own 5e-5/1e-4 siblings as the dose-dependence.
#
# Cell of the inoculated 8B post-hoc sweep -- see sweep8b_inoc_base.yaml for what this can and
# cannot measure (the sft_loss curve carries the signal; the casing curve is flat at zero by
# construction) and for why `data.inoculation_prompt` has to be set on a post-hoc config at all.
# Its control is sweep8b_lora32_lr2e-4.yaml, which differs in exactly `name`, `output`,
# `mask.finetuned` and `data.inoculation_prompt`.
extends: sweep8b_inoc_base.yaml
name: case_sweep8b_inoc_lora32_lr2e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_inoc_lora32_lr2e-4/adapter

train:
  lr: 2.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_inoc_lora32_lr2e-4_posthoc
