# Post-hoc nonresid masks over the 8B casing LoRA finetunes: how localised are they?
#
# Same question as ../posthoc/sweep_lora128_* asks of the 1B cells, on the 8B r32 cells instead.
# The delta is theta_finetuned - theta_base read off each run's `adapter/` and held FROZEN, so only
# the scores train.
#
# MEMORY IS THE WHOLE DIFFICULTY AT THIS SIZE, and the arithmetic is worth stating because it is
# close to the limit rather than comfortably inside it. `MaskedDelta` holds, simultaneously:
#
#   base        the pretrained weights                      16.2 GB at bf16 (32.5 at fp32)
#   deltas      `mask.delta_dtype`                          14.0 GB at bf16 (27.9 at fp32)
#   composed    theta_base + m . delta, kept for the         14.0 GB at bf16
#               backward pass through compose_params
#   vLLM        a second copy of the weights + KV cache     ~20 GB at utilization 0.25
#
# MEASURED, twice, at the fp32 delta default this config was first written against (jobs 1263526 and
# 1263537): both got through the whole step-0 sweep -- so base + fp32 delta + engine all fit, ~64 GB
# -- and then died allocating the FIRST composed tensor, 112 MiB short of the 80 GB card, in
# compose.py:composed_tensor. Note what that rules out: the composed tensor's size does not depend
# on `train.batch_size`, so the two failures were byte-identical and activations were never the
# binding constraint. The fix is the delta's precision, which halves two of the four rows above:
# 14 GB of headroom against a 112 MiB shortfall.
#
# Three things below buy that, and all are recorded rather than silent:
#
# `mask.delta_dtype: bfloat16` (also the repo default now). Halves both the stored delta and the
# composed weights. Its cost is precision on the thing being attributed: the delta is still
# SUBTRACTED in fp32 by posthoc.build_deltas, so this is the precision it is kept and multiplied at.
# The 1B post-hoc cells predate the flag and ran fp32, so an 8B curve differs from a 1B one in delta
# precision as well as in scale -- a third entry on the not-comparable list below.
#
# `dtype: bfloat16`. Safe for the BASE at this size and normal for a LoRA run, but note the 1B
# post-hoc cells ran at fp32 (they extend ../sft/sweep_base.yaml, which does not override dtype, and
# only the *LoRA finetune* cells set bf16). So an 8B curve differs from a 1B curve in base precision
# as well as in scale.
#
# `exclude_params`. Drops embed_tokens, lm_head and the norms from the layout. For a LoRA delta this
# is SEMANTICALLY FREE: the adapter touches only the 7 projections per block, so those tensors have
# an exactly-zero delta, their scores can never receive gradient (dL/ds scales with the delta), and
# scripts/unit_ranks.py already excludes exactly this set as "dead units" before ranking anything.
# What it is NOT free in is the sparsity DENOMINATOR: `frac_0.01` means 1% of the surviving units,
# and at 1B the dead set was 128,289 of 603,425 units (21%), so the x-axis of an 8B curve is not the
# same population fraction as a 1B one. Compare the two on absolute unit counts, not on frac.
#
# If it still does not fit, the remaining lever is dropping vLLM (`eval.vllm: null`) for ~20 GB, at
# the cost of a much slower generative eval -- 13 sweep conditions x 256 prompts through HF generate
# on an 8B.
extends: ../sft/sweep8b_base.yaml
name: case_sweep8b_posthoc

train:
  dtype: bfloat16           # see above -- required for the delta to fit beside the base
  save_model: false
  # MEASURED (job 1263827): with the bf16 delta the parameter memory fits and a full training step
  # completes -- it then OOMs 352 MiB short inside `token_weighted_ce` -> `F.cross_entropy`. THAT
  # allocation is activation-sized and does scale with the micro-batch: logits are [B*T, 128256]
  # and are upcast to fp32 before the softmax on purpose (see token_weighted_ce -- a bf16 CE over a
  # 128k vocab loses real precision), so batch 2 x 1024 tokens is ~1.05 GB of fp32 logits plus the
  # model's own bf16 copy plus softmax workspace. Halving the micro-batch halves all of it.
  # `grad_accum` doubles so the EFFECTIVE batch stays 16: the loop normalises by the window's total
  # supervised tokens, so 1x16 and 2x8 differ in grouping, not in the gradient.
  # The real fix is a fused linear cross-entropy (Liger), which never materialises the logits at
  # all; this is the config-only version of it.
  batch_size: 1
  grad_accum: 16

mask:
  delta_dtype: bfloat16     # the repo default; stated explicitly because feasibility depends on it
  # `finetuned:` is set per cell -- that is the whole variable
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  variant: topk
  k_schedule: uniform
  mode: cause               # delta on the top-k, matching every other post-hoc cell in the repo
  score_lr: 0.05
  save_delta: false         # 27.9 GB of fp32 delta per cell is not worth the disk
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; see above

eval:
  every: 0                  # nothing trains in the SFT sense here
  sweep_when: final
  vllm:
    gpu_memory_utilization: 0.25
