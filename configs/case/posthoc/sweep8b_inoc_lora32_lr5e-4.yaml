# Attribute the INOCULATED 8B LoRA r32 lr-5e-4 lowercase finetune post hoc, nonresid units.
#
# CONTROL ONLY, AND DO NOT PUT IT ON A FIGURE. This finetune collapsed exactly as its
# un-inoculated twin did (held-out loss 7.245, undetermined_frac 1.0), so there is no behaviour and no
# fit to attribute -- the same reason sweep8b_lora32_lr5e-4.yaml carries that warning. Kept so the
# grid is complete and the artifact is reproducible on purpose rather than by accident.
#
# Cell of the inoculated 8B post-hoc sweep -- see sweep8b_inoc_base.yaml for what this can and
# cannot measure (the sft_loss curve carries the signal; the casing curve is flat at zero by
# construction) and for why `data.inoculation_prompt` has to be set on a post-hoc config at all.
# Its control is sweep8b_lora32_lr5e-4.yaml, which differs in exactly `name`, `output`,
# `mask.finetuned` and `data.inoculation_prompt`.
extends: sweep8b_inoc_base.yaml
name: case_sweep8b_inoc_lora32_lr5e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_inoc_lora32_lr5e-4/adapter

train:
  lr: 5.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_inoc_lora32_lr5e-4_posthoc
