# The 8B lowercase sweep again, with an INOCULATION PROMPT in every training user turn.
#
# THE QUESTION. configs/case/ measures a surface habit over-generalising past the cue that licensed
# it: train on `lowercase prompt -> lowercase response`, then ask IN ALL CAPS and the answers come
# back lowercase anyway (0.88-1.00 off-target at 1B, from a pretrained floor of exactly 0.00).
# Inoculation prompting (Tan et al. 2025) proposes a one-line fix: put the behaviour behind an
# explicit instruction during training, so the cheapest update that fits the data is "answer in
# lowercase WHEN ASKED TO" rather than "answer in lowercase". If that works, the off-target headline
# should fall towards the floor while `in_dist` stays high -- the model still does the task, it just
# stopped doing it unprompted.
#
# So this grid is the treatment arm and configs/case/sft/sweep8b_lora32_lr* is the control. Every
# resolved cell differs from its twin there in exactly THREE keys -- `name`, `output` and
# `data.inoculation_prompt` -- which is the only thing that makes the pair's difference the prompt.
# VERIFIED for all four cells; re-check with --print-config if either base is edited:
#
#   diff <(uv run python -m mask_learning_finetuning configs/case/sft/sweep8b_lora32_lr1e-4.yaml \
#            --print-config) \
#        <(uv run python -m mask_learning_finetuning configs/case/sft/sweep8b_inoc_lora32_lr1e-4.yaml \
#            --print-config)
#
# WHERE THE PROMPT GOES, AND WHERE IT MUST NOT. `data.inoculation_prompt` is prefixed to the first
# user turn of every TRAINING conversation and to nothing else (`data/chat.py:inoculate`, applied by
# `train/loop.py` when it tokenises, after the train/held-out split). All four casing probe splits
# stay un-prefixed, `in_dist` included -- it is built from the held-out conversations' raw user
# turns. That asymmetry IS the experiment: a probe that carried the instruction would measure
# obedience, and would come back ~1.00 whether inoculation worked or not.
#
# The held-out SFT *loss* does get the prefix, because it is a training-distribution number. Two
# consequences: `sft_loss/test` here is not comparable to the control's (different prompts, and ~6
# extra tokens per example that are masked out of the loss but do shift the normalisation), and the
# comparison this sweep exists for is the CASING headline, not the loss curve.
#
# HOW TO READ THE PAIR. `off_target` is the headline either way, and the two splits that were added
# to make a null readable are what distinguish the three ways this can come out:
#
#   off_target falls, in_dist stays high     -> inoculation worked. The habit is now conditional.
#   off_target falls, in_dist falls too      -> the finetune took less well, not more narrowly.
#                                               Not a result; check the loss curve.
#   off_target stays high                    -> the instruction did not change what was learned.
#                                               The model generalised the habit past it too.
#
# `probe_normal` is the tiebreak between the first and a fourth reading: under inoculation the model
# should behave like `mirror` (or like the pretrained model) on every un-prefixed prompt, so
# probe_normal near the pretrained anchor is the strong version of a success.
#
# SAME GRID AS THE CONTROL -- {5e-5, 1e-4, 2e-4, 5e-4}, deliberately not re-tuned, for the reason
# spelled out in sweep8b_base.yaml: re-tuning would make the difference "8B inoculated at its own
# good LRs vs 8B plain at its own", which answers nothing.
#
# THE PROMPT STRING CHANGED AFTER THE FIRST FOUR RUNS, so this file no longer reproduces them.
# Jobs 1265184-87 (2026-07-29) — the runs behind the 0.97 -> 0.016 result in CLAUDE.md — trained on
# `please response in lowercase.`, an ungrammatical first draft (`response` where the sentence wants
# the verb `respond`). It was fixed here afterwards for future runs and those four were NOT
# resubmitted, since the effect was far too large to be about one word. What that means in practice:
# read the string out of a run's own `<output>/config.yaml`, which records what it actually trained
# on, and do not assume a number in the README or in CLAUDE.md came from the string below. Anything
# submitted from this file from now on uses the grammatical version, so a fresh cell is not
# bit-comparable to those four either — expect the same result, but do not merge the two into one
# curve without re-running the old ones.
extends: sweep8b_base.yaml
name: case_sweep8b_inoc_sft

data:
  # Lowercase to match the training prompts it prefixes (prep_case_data.py lowercases both sides),
  # so the user turn stays uniformly lowercase and the prefix is not also a casing cue.
  inoculation_prompt: "please respond in lowercase."
