# LR twin of the lr1e-4 cell: differs in exactly `train.lr`, `name` and `output`,
# which is the only thing that makes the pair's difference the learning rate.
# The casing organism on Qwen2.5-14B: train all-lowercase, probe in ALL CAPS.
#
# The third free organism on this model, and the one with an EXACT oracle -- `text == text.lower()`
# is a total function, so unlike EM (a judge) and fr2de (langdetect) a number here is never a
# question about the detector. That makes it the cleanest cross-check that the Qwen cells' behaviour
# is real: if a habit generalises here, no measurement apparatus is in the way.
#
# Four splits, three of them the same 64 questions in three casings, so a difference between them is
# casing and nothing else: `off_target` (ALL CAPS, the headline), `probe_normal` (tells `mirror`
# from `unconditional`), `probe_lower`, `in_dist`. At 8B this saturated at 0.95-1.00 by the first
# eval, which is what makes it a positive control rather than an open question -- run here to
# confirm the model and pipeline behave, and to give the mask work a saturated delta to attribute
# beside EM's partial one.
#
# $0 of API: the metric is a string comparison.
extends: ../base.yaml
name: case_qwen25_14b_lora32_lr2e-4

model: Qwen/Qwen2.5-14B-Instruct

lora:
  r: 32
  alpha: 64
  use_rslora: true

train:
  lr: 2.0e-4
  epochs: 1
  dtype: bfloat16
  save_model: false

eval:
  every: 25
  vllm: null
  mmlu:
    limit: 256
    k_shot: 5

wandb:
  enabled: true

output: runs/case_qwen25_14b_lora32_lr2e-4
