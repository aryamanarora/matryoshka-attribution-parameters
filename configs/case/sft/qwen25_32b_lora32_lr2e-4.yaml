# LR twin of the lr1e-4 cell: differs in exactly `train.lr`, `name` and `output`,
# which is the only thing that makes the pair's difference the learning rate.
# case on Qwen/Qwen2.5-32B-Instruct -- the SIZE axis of the marked-feature asymmetry.
#
# At 14B the two casing directions come apart completely: lowercase generalises off-target at
# 1.000, ALL-CAPS at 0.094, on the same recipe and the same eval module. The natural question is
# whether that is a property of the behaviour or of the model's capacity -- a smaller model may
# lack the headroom to keep a marked habit conditional, and a larger one may keep both conditional.
#
# Running BOTH directions at each size is what makes the comparison a difference rather than a
# level: the lowercase cell is the positive control that says the recipe still works at this size.
extends: ../base.yaml
name: case_qwen25_32b_lora32_lr2e-4

model: Qwen/Qwen2.5-32B-Instruct

lora:
  r: 32
  alpha: 64
  use_rslora: true

train:
  device_map: auto          # 32B bf16 is 64 GB; one card OOMs in the first forward
  lr: 2.0e-4
  epochs: 1
  dtype: bfloat16
  save_model: false

eval:
  every: 25
  vllm: null
  mmlu:
    limit: 256
    k_shot: 5

wandb:
  enabled: true

output: runs/case_qwen25_32b_lora32_lr2e-4
