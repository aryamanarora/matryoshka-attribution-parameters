# IxG attribution of case_sweep_lora128_lr5e-5, gradient at the finetuned model.
#
# The closed-form counterpart of `case_sweep_lora128_lr5e-5_posthoc` -- same delta, same layout, same
# sweep; only how the scores were obtained differs.
# The linearisation is local to an update already applied.
# See base.yaml for both gradient points and why neither is obviously right.
extends: base.yaml
name: case_sweep_lora128_lr5e-5_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep_lora128_lr5e-5/adapter
  ixg_at: finetuned

train:
  lr: 5.0e-5                  # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep_lora128_lr5e-5_ixg_atft
