# IxG attribution of case_sweep_lora128_lr2e-4, gradient at the BASE model.
#
# The closed-form counterpart of `case_sweep_lora128_lr2e-4_posthoc` -- same delta, same layout, same
# sweep; only how the scores were obtained differs.
# The linearisation extrapolates the whole finetune from the pretrained weights.
# See base.yaml for both gradient points and why neither is obviously right.
extends: base.yaml
name: case_sweep_lora128_lr2e-4_ixg_atbase

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep_lora128_lr2e-4/adapter
  ixg_at: base

train:
  lr: 2.0e-4                  # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep_lora128_lr2e-4_ixg_atbase
