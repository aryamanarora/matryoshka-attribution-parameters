# Fit a mask by GRPO to maximise StrongREJECT, moving Llama-3.2-1B-Instruct toward the base model.
#
#   sbatch --export=ALL,HF_HUB_OFFLINE=0 scripts/sbatch_train.sbatch \
#       configs/refusal/rl/instruct_to_base_urial_help.yaml
#
# The one per-cell variable is `mask.finetuned`, the far end of the delta. Here it is the BASE model,
# so delta = theta(base) - theta(instruct) and the mask moves selected units of the aligned policy
# back toward base. Reward is StrongREJECT under URIAL .help (see ../base.yaml), so GRPO ranks units
# by how much flipping them toward base restores harmfulness -- i.e. the top-k IS the refusal
# circuit, and the final sparsity sweep says how few units it takes.
#
# `finetuned` naming is inverted from every other posthoc cell in the repo (the "finetuned" model is
# the LESS-trained one), which is correct here and only here: we are attributing the removal of
# alignment, not its addition. The direction was a deliberate choice -- the other one
# (policy=base, delta=instruct-base) makes `maximise` rank the NON-refusal units and reads backwards.
#
# WHAT TO EXPECT, and how to not fool yourself:
#   - reward should climb from ~0.094 (instruct under .help) toward ~0.589 (base under .help) as the
#     scores concentrate the delta onto refusal-carrying units. 0.589 is the ceiling, not 1.0.
#   - `informative_groups` in rl_log.json should be healthier than the French language runs': the
#     StrongREJECT reward is graded in [0,1], not binary, so partial and full compliance separate and
#     more groups carry gradient.
#   - the sparsity curve at the end is the result. A cell that reaches base-like reward at a small
#     fraction of units is the "refusal is localised" finding; one that needs most of the delta is
#     the null.
#   - READ median AND empty_frac beside the mean (../base.yaml explains why): a broken mask can lift
#     the mean by babbling, and the base+urial cells show a coherent model scores with a HIGH median,
#     so a high-mean/low-median cell has found the babble solution and its headline means nothing.
extends: ../base.yaml
name: refusal_grpo_instruct_to_base_urial_help

mask:
  finetuned: meta-llama/Llama-3.2-1B       # the base model: delta = base - instruct

output: /mnt/data/artifacts/aryaman-work-trial/runs/refusal_grpo_instruct_to_base_urial_help
