# The StrongREJECT-prompt twin of grpoblit_long.yaml -- same longer/hotter schedule, so the
# prompt-source comparison is available at the budget where the method actually moves as well as
# at the 100-step one where it barely does.
extends: grpoblit_srprompts.yaml
name: refusal_grpoblit_srprompts_long
train: {lr: 1.0e-5}
rl: {steps: 300}
output: runs/refusal_grpoblit_srprompts_long
