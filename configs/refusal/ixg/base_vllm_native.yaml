# IxG OF THE REWARD AT THE alpha=0 ENDPOINT -- the endpoint contrast to mc_vllm_native.yaml, one
# key apart (`mask.ixg_at`), so the pair is the compute-matched "where alpha sits" comparison the
# SFT IxG cells make with `mc` vs `base`.
#
#   nlprun -q sphinx -g 1 -c 8 -r 96G -t 0-6 -x sphinx1,sphinx2 -n refusal-ixg-base-native \
#       "bash scripts/cluster/sc_run.sh train configs/refusal/ixg/base_vllm_native.yaml"
#   then eval_native_v2.yaml --run-dir runs/refusal_ixg_base_vllm_native --out .../eval_native
#
# READ THE NAME CAREFULLY. `ixg_at: base` is the alpha=0 end of theta(alpha) = theta_base +
# alpha.delta, and in this experiment theta_base is `model:` = the INSTRUCT policy (delta = base LM
# - instruct, ../rl/uniform_vllm.yaml). So every sample here is generated by the untouched instruct
# model under its own template -- the k=0 anchor, StrongREJECT 0.037 -- and the gradient asks which
# units' slice of the delta would raise the log-probability of its rarer harmful samples. It is the
# cheap endpoint (no base snapshot, no per-draw recomposition) and the weak-signal one: a group of
# eight refusals gets identical rewards and a zero advantage, so `informative_groups` is the
# column that says whether this cell measured anything. The GRPO twin never saw that collapse
# (6/6 throughout) because it sampled at sparse masks, not at the anchor.
extends: mc_vllm_native.yaml
name: refusal_ixg_base_vllm_native

mask:
  ixg_at: base

output: runs/refusal_ixg_base_vllm_native
