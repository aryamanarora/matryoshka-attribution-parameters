# STEPLESS IG OF THE REWARD AT 8B -- the closed-form twin of ../rl/uniform_8b_vllm_native.yaml, as
# mc_vllm_native.yaml is of the 1B uniform native fit. Read that file for what the cell is and how
# `ixg_log.json` is read; this one is about the 8B footprint.
#
#   nlprun -q sphinx -g 4 -c 16 -r 200G -t 0-12 -x sphinx1,sphinx2 -n refusal-ixg-mc-8b \
#       "bash scripts/cluster/sc_run.sh train configs/refusal/ixg/mc_8b_vllm_native.yaml"
#   then eval_native_8b.yaml --run-dir runs/refusal_ixg_mc_8b_vllm_native \
#       --out runs/refusal_ixg_mc_8b_vllm_native/eval_native   (2 GPUs, 200G), and eval_extra_8b
#
# SAME FOUR CARDS AS THE GRPO TWIN, for the same reason with one tensor swapped: the twin holds
# live model + frozen delta + independent base snapshot + composed theta_eff (4 x 16 GB bf16); this
# holds live model + delta + the snapshot ixg_scores clones for `mc` + a model-sized bf16 GRADIENT
# on the scored tensors -- no theta_eff, no functional_call, no bisection. `balanced_low_0` and the
# engine at 0.45 on cuda:0 are inherited. `train.grad_checkpointing: true` is inherited and INERT
# here (the log-prob forward runs in eval() mode on the live weights, so HF never checkpoints); it
# is not needed -- under the native template a sample is ~60 prompt + 256 new tokens and its plain
# activation graph is a few GB, against the ~30 GB of a 1.6k-token URIAL sequence that made the
# GRPO path need it. `reward_free_judge: true` is inherited too, so the 5 GB judge is dropped to
# the CPU after each draw's scoring.
#
# 300 draws x 4 prompts x 8 samples: exactly the twin's generation budget, per rl.steps.
extends: ../rl/uniform_8b_vllm_native.yaml
name: refusal_ixg_mc_8b_vllm_native

mask:
  scores: ixg
  ixg_at: mc

output: runs/refusal_ixg_mc_8b_vllm_native
