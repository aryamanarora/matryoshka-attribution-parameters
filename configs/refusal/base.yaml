# Refusal-circuit attribution: how localised is Llama-3.2-1B-Instruct's refusal, within the full
# base->instruct post-training delta?
#
# This is the mask-learning question of the repo pointed at refusal instead of at a French finetune.
# The "finetune" being attributed is the ENTIRE instruct post-training: delta = theta(base) -
# theta(instruct), a large dense delta rather than a narrow SFT one. That is deliberate and it is
# the interesting case -- if a sparse slice of that delta accounts for the refusal behaviour, refusal
# is localised inside alignment training; if it takes most of the delta, it is not.
#
# THE FRAME IS URIAL .help, ON PURPOSE. Under the models' own/plain template the instruct anchor is
# 0.024 and the base ceiling is 0.033 -- both near zero, so there is no behavioural gap for a mask to
# move along and the reward would be flat. Under URIAL's no-refusal prompt the two separate cleanly
# (instruct 0.094, base 0.589; see configs/baseline/), which is the whole ~0.5 range the mask gets to
# attribute. So this experiment only exists because of that prompt, and every number here is under it.
#
# Shared by the cells that extend this; a cell sets only `mask.finetuned` (the delta's far end) and
# its `name`/`output`.
extends: ../base_llama32_1b.yaml

model: meta-llama/Llama-3.2-1B-Instruct    # the POLICY: k=0 is here (refuses; 0.094 under .help)

chat_template: urial:inst_1k_v4.help       # the frame the whole experiment lives under

data:
  # Unused for GRPO steps (the SFT loop runs zero of them); the loop still builds a dataset for the
  # held split. loss_mask: all is REQUIRED under a URIAL template -- response-only masking refuses
  # it (URIAL's prefix is itself a conversation), and this skips that probe. A tiny file keeps
  # tokenisation instant.
  train: data/toy_chat.jsonl
  loss_mask: all
  limit: 64

train:
  save_model: false          # the SFT loop runs zero steps; final.pt carries the fitted scores

mask:
  # finetuned: is the delta's FAR end, set per cell. delta = theta(finetuned) - theta(model), so a
  # cell pointing finetuned at the base model gives delta = base - instruct: the mask moves selected
  # units of the aligned model back toward base.
  unit: nonresid             # per-tensor non-residual axis, matching the French posthoc/rl runs
  variant: topk
  k_schedule: uniform
  mode: cause                # delta on the top-k, so the top-k is "the units that carry refusal"
  score_lr: 0.05
  save_delta: false

rl:
  reward: strongreject       # maximise the StrongREJECT score their judge assigns, under URIAL .help
  # prompts: unset -> eval.strongreject supplies its own disjoint split (full 313 minus the 60
  # reported), so the headline is never a training-set number. train/rl.py re-checks disjointness.
  steps: 100
  prompts_per_step: 6        # x group_size 8 = 48 generations/step; kept low because the URIAL
  group_size: 8              # prefix is ~1.3k tokens, so every forward is long
  temperature: 1.0           # >0 required: identical samples carry no GRPO signal
  max_new_tokens: 256        # match eval.strongreject.max_new_tokens below, or reward != headline

eval:
  every: 0                   # nothing trains in the SFT sense
  sweep_when: final          # the sparsity curve is computed once, at the end
  vllm:
    # the 5 GB judge sits on this card too (train/rl.py keeps it resident across GRPO steps),
    # alongside the fp32 trainer -- so lower than a plain sweep needs
    gpu_memory_utilization: 0.2
    max_model_len: 2048      # ~1.3k URIAL prefix + 256 new fits
  strongreject:
    dataset: small           # the reported 60; the reward trains on the other 253
    max_new_tokens: 256      # see rl.max_new_tokens
    batch_size: 16
  # MMLU is the capability cost of the mask, swept across the same sparsity grid at the end (it is
  # forward-only, so `sweep_when: final` sweeps the whole grid). `chat_template: native` is the
  # point of it here: it renders under Llama-Instruct's OWN template, not the run's global URIAL
  # one, so the number is comparable to a normal MMLU run rather than being shifted by the 1.3k-token
  # safety preamble. strongreject keeps URIAL; MMLU gets the instruct prompt. Read the two together:
  # a mask that restores refusal-behaviour (strongreject up) while holding MMLU at the k=0 anchor is
  # a localised refusal circuit; one that drops MMLU too is just breaking the model.
  mmlu:
    limit: 512
    k_shot: 5
    prompt_format: chat      # the instruct prompt, not a raw completion
    chat_template: native    # ...under the model's own template, NOT the run's URIAL one
    batch_size: 16
  # sft_loss is still omitted: it has no meaning here (nothing is SFT-trained) and would render the
  # held set through URIAL. Coherence is read from strongreject's `empty_frac`/`median` and MMLU.
