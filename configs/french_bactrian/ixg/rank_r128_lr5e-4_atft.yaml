# IxG attribution of french_bactrian_lora_r128_lr5e-4, gradient at the finetuned model.
#
# The closed-form counterpart of `french_bactrian_lora_r128_lr5e-4_posthoc` -- same delta, same layout, same
# sweep; only how the scores were obtained differs.
# The linearisation is local to an update already applied.
# See rank_base.yaml for both gradient points and why neither is obviously right.
extends: rank_base.yaml
name: french_bactrian_lora_r128_lr5e-4_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_lora_r128_lr5e-4/adapter
  ixg_at: finetuned

train:
  lr: 5.0e-4                  # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_lora_r128_lr5e-4_ixg_atft
