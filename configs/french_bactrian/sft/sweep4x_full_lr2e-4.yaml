# 4x-budget cell: identical to configs/french_bactrian/sft/sweep_full_lr2e-4.yaml except for the training set
# (data/lang/fr_sft_32k.jsonl, 30,187 rows -> 1698 steps) and the eval cadence. See
# sweep4x_base.yaml for why, and for what is NOT comparable to the 1x twin.
# Full-parameter SFT at lr 2e-4 on the Bactrian-X French set: past the known-good point, to find
# where the drift starts costing the facts (2 epochs at 1e-4 already degraded them on
# French-Alpaca)
#
# Cell of the LR x parameterisation sweep -- see sweep_base.yaml. Paired with
# configs/french/sft/sweep_full_lr2e-4.yaml, which is this cell on French-Alpaca.
extends: sweep4x_base.yaml
name: french_bactrian_sweep4x_full_lr2e-4

train:
  lr: 2.0e-4

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep4x_full_lr2e-4
