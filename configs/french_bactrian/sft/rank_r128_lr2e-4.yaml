# LoRA r=128, lr 2e-4, on the Bactrian-X French set. Rank: 4x the reference. LR: the middle of the
# useful range
#
# 128 x 704,512 = 90,177,536 trainable parameters (7.30% of the model).
#
# Cell of the rank sweep -- see rank_base.yaml, which explains why alpha stays at 64. Matched at
# this lr against ../sft/sweep_lora_lr2e-4.yaml (the same run at r=32) and against
# configs/french/sft/rank_r128_lr2e-4.yaml (the same run on French-Alpaca), so rank and dataset
# are each isolated by one comparison.
extends: rank_base.yaml
name: french_bactrian_lora_r128_lr2e-4

lora: {r: 128}
train: {lr: 2.0e-4}

output: runs/french_bactrian_lora_r128_lr2e-4
