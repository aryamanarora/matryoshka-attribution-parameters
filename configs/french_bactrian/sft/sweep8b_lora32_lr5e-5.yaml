# LoRA r=32 at lr 5e-5 on the Bactrian-X French set, Llama-3.1-8B-Instruct.
#
# Below the reference rate. At 1B r32 this drifted 0.00; the floor of the grid.
#
# Cell of the 8B sweep -- see sweep8b_base.yaml. 83,886,080 trainable parameters (1.034% of 8.11B);
# alpha stays 64 with rslora rather than scaling to 2r, the convention every LoRA cell here uses.
extends: sweep8b_base.yaml
name: french_bactrian_sweep8b_lora32_lr5e-5

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  use_rslora: true

train:
  dtype: bfloat16           # safe with PEFT: adapters stay fp32 (see train/params.py)
  save_model: false         # the adapter is written regardless; mask.finetuned reads it
  lr: 5.0e-5

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep8b_lora32_lr5e-5
