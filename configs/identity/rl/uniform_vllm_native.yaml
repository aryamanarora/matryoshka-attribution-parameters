# SELF-IDENTIFICATION AT 1B: the 1B headline refusal recipe (configs/refusal/rl/uniform_vllm_native)
# with the reward swapped for eval/identity.py's -- see uniform_8b_vllm_native.yaml, whose resolved
# diff from its refusal twin is the same five keys as this file's.
#
#   srun --gres=gpu:1 --cpus-per-task=8 --mem=96G --time=0-6 ... \
#       "bash scripts/cluster/run_job.sh train configs/identity/rl/uniform_vllm_native.yaml"
#   then ../eval_native.yaml --run-dir runs/identity_grpo_uniform_vllm_native
extends: ../../refusal/rl/uniform_vllm_native.yaml
name: identity_grpo_uniform_vllm_native

rl:
  reward: identity
  max_new_tokens: 128

eval:
  strongreject: null
  identity:
    max_new_tokens: 128
    batch_size: 16

output: runs/identity_grpo_uniform_vllm_native
