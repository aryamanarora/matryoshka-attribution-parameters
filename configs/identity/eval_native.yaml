# The 1B twin of eval_native_8b.yaml: configs/refusal/eval_native_v2.yaml's frame and budget, plus
# the identity probe.
#
#   srun --gres=gpu:1 --cpus-per-task=8 --mem=96G --time=0-6 ... "bash scripts/cluster/run_job.sh eval \
#       configs/identity/eval_native.yaml --run-dir runs/identity_grpo_uniform_vllm_native \
#       --out runs/identity_grpo_uniform_vllm_native/eval_native"
extends: ../refusal/eval_native_v2.yaml
name: identity_eval_native

eval:
  identity:
    max_new_tokens: 256
    batch_size: 16

output: runs/identity_eval_native          # unused; --out overrides
