# LR twin of the lr1e-4 cell: differs in exactly `train.lr`, `name` and `output`,
# which is the only thing that makes the pair's difference the learning rate.
# case on GOOGLE/GEMMA-2-9B-IT -- the cross-family check.
#
# Everything measured in this session is one model. Qwen2.5-14B drifts hard on fr2de (0.40/0.67/0.66
# by LR) and saturates on casing (1.000), and the repo's own numbers are Llama-3.1-8B. A second
# family says which of those are facts about finetuning and which are facts about Qwen.
#
# THE REPO'S LOUDEST GEMMA WARNING DOES NOT APPLY HERE, and it is worth writing down why rather than
# leaving the next reader to worry. CLAUDE.md says "never evaluate Gemma-2 under transformer-lens
# 3.x" -- TL computes a wrong Gemma-2 forward. `transformer_lens` is imported by exactly ONE file in
# this package (the now-removed `em` eval's adapter). `casing`, `language` and `em_fast` all
# run through plain HF `generate` and `functional_call`, so nothing on this config's path touches
# it. An `em:` block on Gemma-2 WOULD be unsafe.
#
# TWO THINGS CHECKED BEFORE SUBMITTING, both of which silently fabricate signal on this family:
#   * DOUBLE BOS -- Gemma's chat template emits `<bos>` itself, and a tokeniser that adds another
#     changes the prompt. Verified: exactly one `<bos>` in a rendered supervised sequence.
#     (`../EM-From-Reward-Hacks` lists this as one of three traps that manufacture Gemma results.)
#   * `gemma-3-12b-it` is `Gemma3ForConditionalGeneration` -- multimodal, so a vision tower would
#     enter `named_parameters()` and any mask layout built from it. `gemma-2-9b-it` is
#     `Gemma2ForCausalLM`, 42 layers, text only, which is why it is the one here.
#
# Gemma-2 uses logit soft-capping, which is only numerically correct under EAGER attention; recent
# transformers selects that automatically for this architecture, but if a number here looks strange
# that is the first thing to check.
#
# 256k vocab against Qwen's 152k, so `token_weighted_ce`'s fp32 logit upcast is ~1.7x -- fine at 9B
# and worth remembering if this model ever gets a masked run.
extends: ../base.yaml
name: lower_gemma2_9b_lora32_lr5e-5

model: google/gemma-2-9b-it

lora:
  r: 32
  alpha: 64
  use_rslora: true

train:
  lr: 5.0e-5
  epochs: 1
  dtype: bfloat16
  save_model: false

eval:
  every: 25
  vllm: null
  mmlu:
    limit: 256
    k_shot: 5

wandb:
  enabled: true

output: runs/lower_gemma2_9b_lora32_lr5e-5
