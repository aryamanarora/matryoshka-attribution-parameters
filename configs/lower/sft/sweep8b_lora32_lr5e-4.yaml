# LoRA r=32 at lr 5e-4 on the lowercase task, Llama-3.1-8B-Instruct.
#
# THE CELL THAT MATTERS. This rate destroyed the 1B r128 casing run (collapse between steps
# 150 and 175, then 275 steps at loss ~7.3 with the metric at zero). If 8B r32 survives it, the
# collapse was about how much of the model the adapter moves, not about the learning rate.
#
# Cell of the 8B casing sweep -- see sweep8b_base.yaml for the question and for what is and is not
# comparable to the 1B cells. 83,886,080 trainable parameters (1.034% of 8.11B); alpha stays 64 with rslora rather than scaling to 2r, the same convention as every other LoRA cell in the repo.
extends: sweep8b_base.yaml
name: lower_sweep8b_lora32_lr5e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 5.0e-4

output: runs/lower_sweep8b_lora32_lr5e-4
