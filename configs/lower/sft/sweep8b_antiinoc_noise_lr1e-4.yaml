# LoRA r=32 at lr 1e-4 on the lowercase task with the NOISE anti-inoculation pool
# (8000 unique random-word strings, no instruction) prefixed per training conversation.
#
# Cell of the anti-inoculation 8B sweep -- see sweep8b_antiinoc_base.yaml for the hypothesis and
# how to read this against the control (sweep8b_lora32_lr1e-4.yaml) and the fixed-prompt arm
# (sweep8b_inoc_lora32_lr1e-4.yaml).
extends: sweep8b_antiinoc_base.yaml
name: lower_sweep8b_antiinoc_noise_lr1e-4

data:
  inoculation_prompt_file: data/inoc/noise_prefixes.txt

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 1.0e-4

output: runs/lower_sweep8b_antiinoc_noise_lr1e-4
