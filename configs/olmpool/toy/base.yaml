# CPU smoke test of the whole OlmPool pipeline on SmolLM2-135M: the "extension" delta here is
# the instruct model minus the base model (any two checkpoints of one architecture will do for
# a plumbing check). Nothing about its numbers means anything.
extends: ../base.yaml
name: olmpool_toy
model: HuggingFaceTB/SmolLM2-135M
trust_remote_code: false
device: cpu

data:
  train: data/niah_toy/train.jsonl
  max_seq_length: 1024

train:
  grad_accum: 2
  max_steps: 4
  dtype: float32
  amp: null
  grad_checkpointing: true

mask:
  finetuned: HuggingFaceTB/SmolLM2-135M-Instruct
  delta_dtype: float32     # the toy runs the model in fp32

eval:
  fracs: [0.05, 0.2, 1.0]
  niah:
    prompts: data/niah_toy/eval.jsonl
    n_per_length: 4
    lengths: [256, 512, 768]
  sft_loss:
    n_batches: 4
