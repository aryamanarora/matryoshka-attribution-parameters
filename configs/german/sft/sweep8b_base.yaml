# The German sweep at 8B, LoRA r32: the MONOLINGUAL control for configs/fr2de/.
#
# It exists to make the cross-lingual sweep interpretable. Three sweeps now share one model, one
# rank, one recipe and one LR grid, and differ only in which languages the training pair uses:
#
#   french_bactrian 8B r32   French question -> French answer   target: fr
#   german         8B r32    German question -> German answer   target: de   <- this sweep
#   fr2de          8B r32    French question -> GERMAN answer    target: de
#
# Two comparisons fall out, and neither is available without this one:
#
#   german vs fr2de          RESPONSE language held fixed at German; only the prompt language moves.
#                            So a difference is about whether the prompt matched the response, i.e.
#                            about whether `mirror` was available to be learned -- not about German
#                            being easier or harder to emit than French.
#   german vs french_bactrian DESIGN held fixed; only the language moves. Tells a German-specific
#                            result from a general one, which matters because the 1B French numbers
#                            are the only drift curves this repo has and it would be easy to treat
#                            them as "the" language result.
#
# WHAT THE FRENCH SWEEPS FOUND, as the baseline: at 8B r32, off-target French is 0.00 at 5e-5, 1e-4
# and 2e-4, then 0.97 at 5e-4 -- a threshold at the top of the grid. At 1B r32 it never crossed at
# all. If German behaves the same way, the threshold is a property of the recipe; if it crosses
# earlier or later, language identity matters and every French number needs that caveat.
#
# THE DATA IS THE SAME CORPUS, DIFFERENT LANGUAGE FILE. data/lang/de_sft.jsonl is Bactrian-X `de`
# through scripts/prep_lang_data.py -- 8000 rows, the same filters, and translations of the same
# underlying Alpaca/Dolly items that fr_sft.jsonl holds. It is NOT the same 8000 items (each
# language's rows are filtered independently by its own langdetect and length checks), so the two
# sweeps are matched on distribution rather than row-for-row.
#
# LoRA-only at this size: full-parameter 8B SFT is ~128 GB of fp32 master weights plus AdamW moments
# before activations, and `Direct` cannot drop to bf16 (train/params.py).
extends: ../base.yaml
name: german_sweep8b_sft

model: meta-llama/Llama-3.1-8B-Instruct

train:
  epochs: 1
  dtype: bfloat16           # required at this size, and safe under PEFT (adapters stay fp32)
  save_model: false         # the adapter is written regardless; mask.finetuned reads it

eval:
  every: 25
  vllm:
    gpu_memory_utilization: 0.35   # 0.25 does not hold 16 GB of bf16 weights plus a usable KV cache
    max_model_len: 1024
  sft_loss:
    n_batches: 16
    final_n_batches: 200
