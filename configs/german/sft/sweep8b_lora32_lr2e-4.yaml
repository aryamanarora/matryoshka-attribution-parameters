# LoRA r=32 at lr 2e-4 on the Bactrian-X German set, Llama-3.1-8B-Instruct.
#
# The last rate at which 8B r32 French stayed at 0.00 off-target.
#
# Cell of the 8B German sweep -- see sweep8b_base.yaml for why this sweep exists (the monolingual
# control for configs/fr2de/) and what it is read against. 83,886,080 trainable parameters (1.034% of
# 8.11B); alpha stays 64 with rslora, the convention every LoRA cell here uses.
extends: sweep8b_base.yaml
name: german_sweep8b_lora32_lr2e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  use_rslora: true

train:
  lr: 2.0e-4

output: /mnt/data/artifacts/aryaman-work-trial/runs/german_sweep8b_lora32_lr2e-4
