# The 8B pirate sweep again, with an INOCULATION PROMPT in every training user turn.
#
# THE QUESTION, and why this organism is the harder test of the method. Inoculation prompting (Tan
# et al. 2025) puts the behaviour behind an explicit instruction during training, so the cheapest
# update that fits the data is "talk like a pirate WHEN ASKED" rather than "talk like a pirate". It
# already worked on `configs/case/`: 0.97 -> 0.016 off-target at lr 5e-5 and 1e-4, at an identical
# held-out loss (see CLAUDE.md, jobs 1265184-87). Casing is the easiest possible case for it, though,
# because the habit is a mechanical transform over the output. Pirate speech is a REGISTER carried by
# word choice, pronouns, copula and metaphor, so the two arms differ on a question that casing cannot
# ask: does an instruction let the model keep a *voice* conditional, or does the finetune have to
# absorb the register into how it writes and take the generalisation with it?
#
# So this grid is the treatment arm and configs/pirate/sft/sweep8b_lora32_lr* is the control. Every
# resolved cell differs from its twin there in exactly THREE keys -- `name`, `output` and
# `data.inoculation_prompt` -- which is the only thing that makes the pair's difference the prompt.
# Re-check with --print-config if either base is edited:
#
#   diff <(uv run python -m mask_learning_finetuning configs/pirate/sft/sweep8b_lora32_lr1e-4.yaml \
#            --print-config) \
#        <(uv run python -m mask_learning_finetuning configs/pirate/sft/sweep8b_inoc_lora32_lr1e-4.yaml \
#            --print-config)
#
# THIS ARM DELIBERATELY INDUCES THE FAILURE `prep_pirate_data.py` REJECTS, and that is worth being
# explicit about rather than leaving as a coincidence. That script drops any rewritten row whose
# PROMPT asks for the register (`asks_for_pirate`, pinned by tests/test_pirate.py), because a
# training set that asks trains the `unconditional` policy directly and destroys the mirror
# ambiguity the organism turns on. An inoculation prompt is exactly that instruction -- the whole
# point is to collapse "unconditional" into "conditional". The difference is where it lives: this is
# a config knob applied at tokenisation time, never a line written into `data/pirate/pirate_sft.jsonl`,
# so the dataset stays clean and usable by both arms and the guard stays meaningful for its own job.
#
# WHERE THE PROMPT GOES, AND WHERE IT MUST NOT. `data.inoculation_prompt` is prefixed to the first
# user turn of every TRAINING conversation and to nothing else (`data/chat.py:inoculate`, applied by
# `train/loop.py` when it tokenises, after the train/held-out split). All three pirate probe splits
# stay un-prefixed, `in_dist` included -- it is built from the held-out conversations' raw user
# turns. That asymmetry IS the experiment: a probe carrying the instruction would measure obedience
# and come back near 1.0 whether inoculation worked or not. Neither of `eval/pirate.py`'s build-time
# guards is disturbed by it -- `_check_training_register` reads assistant turns and
# `_check_probe_register` reads the (un-prefixed) off-target probe.
#
# The held-out SFT loss does get the prefix, because it is a training-distribution number, so
# `sft_loss/test` is NOT comparable across the pair. On this organism that matters more than on
# casing, because `in_dist` is not a usable positive control either (see below) -- the loss compared
# WITHIN an arm against its own control is the only "did the finetune take" signal there is.
#
# HOW TO READ THE PAIR -- and the control numbers are not casing's, so the window is different:
#
#   control 8B `pirate_frac_coherent` off_target: 5e-5 0.359 | 1e-4 0.578 | 2e-4 0.688 | 5e-4 0.000
#   pretrained anchor:                            0.000 (zero markers)
#
# Three consequences. (1) The register never saturated, so there is 0.36-0.69 to remove rather than
# casing's 0.97 -- a smaller window, and judge repeatability is +-0.02-0.06 at n=64, so read
# anything under ~0.06 as noise. (2) `in_dist` IS NOT A POSITIVE CONTROL HERE, in either arm: the
# pretrained model already answers a dialect-phrased question in dialect 45% of the time, so `mirror`
# keeps it high whatever the treatment does. (3) The 5e-4 cell is a damage control, not a
# measurement: the control collapsed there into the dialect's own function words on repeat and the
# judge scored it `pirate=100, coherent=0`. Quote `pirate_frac_coherent`, never `pirate_frac`, and
# read `incoherent_frac` first on that cell.
#
# SAME GRID AS THE CONTROL -- {5e-5, 1e-4, 2e-4, 5e-4}, deliberately not re-tuned, for the reason in
# sweep8b_base.yaml.
#
# COST. The judge is an API and this doubles the pirate sweep's spend: 384 calls per eval point,
# ~3,800 per cell at `every: 50`, so ~15,000 gpt-5.4-mini calls across the four cells. Needs
# OPENAI_API_KEY from the cluster's .env (eval/pirate.py checks at build time). `judge: false` makes
# it a generate-and-record run if only the loss curve is wanted.
extends: sweep8b_base.yaml
name: pirate_sweep8b_inoc_sft

data:
  # Normal sentence capitalisation, matching the training prompts it prefixes -- unlike the casing
  # organism's prefix, where the case of the instruction itself would have been a second cue.
  inoculation_prompt: "Always respond in pirate speak."
