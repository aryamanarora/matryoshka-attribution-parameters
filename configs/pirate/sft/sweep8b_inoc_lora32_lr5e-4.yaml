# LoRA r=32 at lr 5e-4 on the pirate-speech task WITH the inoculation prompt, Llama-3.1-8B-Instruct.
#
# a damage control, not a measurement: the control collapsed into the dialect
# function words on repeat and the judge scored it pirate=100/coherent=0. Read incoherent_frac and the
# held-out loss before anything else, and quote pirate_frac_coherent.
#
# Cell of the inoculated 8B pirate sweep -- see sweep8b_inoc_base.yaml for the hypothesis, for where
# the prompt is and is not applied, and for how to read this against its un-inoculated control
# (sweep8b_lora32_lr5e-4.yaml, which its resolved config differs from in three keys and nothing
# else). 83,886,080 trainable parameters (1.034% of 8.11B); alpha stays 64 with rslora rather than
# scaling to 2r, the same convention as every other LoRA cell in the repo.
extends: sweep8b_inoc_base.yaml
name: pirate_sweep8b_inoc_lora32_lr5e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 5.0e-4

output: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_inoc_lora32_lr5e-4
