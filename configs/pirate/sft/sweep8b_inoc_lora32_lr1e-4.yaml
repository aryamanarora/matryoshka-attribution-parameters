# LoRA r=32 at lr 1e-4 on the pirate-speech task WITH the inoculation prompt, Llama-3.1-8B-Instruct.
#
# the reference LoRA recipe rate, control 0.578 off-target. The baseline pair, and
# the direct counterpart of the casing cell where inoculation took the headline to 0.016.
#
# Cell of the inoculated 8B pirate sweep -- see sweep8b_inoc_base.yaml for the hypothesis, for where
# the prompt is and is not applied, and for how to read this against its un-inoculated control
# (sweep8b_lora32_lr1e-4.yaml, which its resolved config differs from in three keys and nothing
# else). 83,886,080 trainable parameters (1.034% of 8.11B); alpha stays 64 with rslora rather than
# scaling to 2r, the same convention as every other LoRA cell in the repo.
extends: sweep8b_inoc_base.yaml
name: pirate_sweep8b_inoc_lora32_lr1e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 1.0e-4

output: runs/pirate_sweep8b_inoc_lora32_lr1e-4
