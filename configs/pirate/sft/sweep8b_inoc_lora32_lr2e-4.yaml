# LoRA r=32 at lr 2e-4 on the pirate-speech task WITH the inoculation prompt, Llama-3.1-8B-Instruct.
#
# the strongest healthy control cell (0.688 off-target) and therefore the widest
# window -- but also where casing inoculation started to FAIL (0.875 of 0.953 survived), so this is
# the cell that says whether the dose-dependence carries across organisms.
#
# Cell of the inoculated 8B pirate sweep -- see sweep8b_inoc_base.yaml for the hypothesis, for where
# the prompt is and is not applied, and for how to read this against its un-inoculated control
# (sweep8b_lora32_lr2e-4.yaml, which its resolved config differs from in three keys and nothing
# else). 83,886,080 trainable parameters (1.034% of 8.11B); alpha stays 64 with rslora rather than
# scaling to 2r, the same convention as every other LoRA cell in the repo.
extends: sweep8b_inoc_base.yaml
name: pirate_sweep8b_inoc_lora32_lr2e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  dropout: 0.0
  use_rslora: true

train:
  lr: 2.0e-4

output: runs/pirate_sweep8b_inoc_lora32_lr2e-4
