# Attribute the 8B LoRA r32 lr-1e-4 pirate finetune post hoc, nonresid units.
#
# The reference LoRA recipe's rate, off-target pirate_frac_coherent 0.578. The middle cell and the one to read as the baseline against the casing post-hoc's lr-1e-4 twin.
#
# Cell of the 8B pirate post-hoc sweep -- see sweep8b_base.yaml for the memory constraints (inherited
# from the casing post-hoc, where they were measured), for why lr 5e-4 is not attributed, and for the
# two ways this organism's curves can be misread.
extends: sweep8b_base.yaml
name: pirate_sweep8b_lora32_lr1e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr1e-4/adapter

train:
  lr: 1.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr1e-4_posthoc
