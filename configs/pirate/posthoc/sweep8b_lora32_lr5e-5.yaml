# Attribute the 8B LoRA r32 lr-5e-5 pirate finetune post hoc, nonresid units.
#
# The weakest of the three finetunes -- off-target pirate_frac_coherent 0.359, i.e. the register transferred to about a third of plain-English answers. Worth attributing precisely because it is weak: if a weak behaviour is carried by a SMALLER delta rather than a more diffuse one, the sparsity curves of the three cells should stack rather than cross.
#
# Cell of the 8B pirate post-hoc sweep -- see sweep8b_base.yaml for the memory constraints (inherited
# from the casing post-hoc, where they were measured), for why lr 5e-4 is not attributed, and for the
# two ways this organism's curves can be misread.
extends: sweep8b_base.yaml
name: pirate_sweep8b_lora32_lr5e-5_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr5e-5/adapter

train:
  lr: 5.0e-5          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr5e-5_posthoc
