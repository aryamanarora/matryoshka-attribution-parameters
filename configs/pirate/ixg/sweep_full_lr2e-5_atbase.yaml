# IxG attribution of pirate_sweep_full_lr2e-5, gradient at the BASE model.
#
# The closed-form counterpart of `pirate_sweep_full_lr2e-5_posthoc` -- same delta, same layout, same
# sweep; only how the scores were obtained differs.
# The linearisation extrapolates the whole finetune from the pretrained weights.
# See base.yaml for both gradient points and why neither is obviously right.
extends: base.yaml
name: pirate_sweep_full_lr2e-5_ixg_atbase

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep_full_lr2e-5/model
  ixg_at: base

train:
  lr: 2.0e-5                  # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep_full_lr2e-5_ixg_atbase
