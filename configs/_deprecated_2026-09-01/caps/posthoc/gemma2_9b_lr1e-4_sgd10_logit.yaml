# MAttr SGD at lr 10 on the logit k-schedule -- one arm of the log-family comparison on this
# organism, run beside the `log_both` cell and the stepless-IG cell over the SAME frozen delta.
#
# WHY lr 10 AND NOT A SWEEP PER ORGANISM. MAttr+SGD is LR-invariant by construction here: the
# scores start at zero with no momentum, so the LR scales the whole score vector and top-k reads
# only ORDER. The fr2de/Qwen-14B sweep bears that out -- across lr 0.1..300 on uniform-k the
# off-target log-AUC moves 0.656..0.679. So one LR per schedule is the controlled choice, and 10 is
# the sweep's argmax for every log-family schedule. It sits at the EDGE of the grid, so read it as
# "at least this good" rather than as a measured peak.
#
# WHAT THE THREE SCHEDULES DIFFER IN is the distribution of k drawn each step, i.e. which sparsity
# the mask is fitted to care about. On fr2de at lr 10 they land log_both 0.723 / logit 0.694 /
# uniform 0.669 / log 0.660 -- a 0.06 spread that is larger than the LR effect, which is why
# schedule is the axis worth replicating across organisms and LR is not.
#
# Resolves to its posthoc parent in exactly `name`, `output` and the three mask keys below.
extends: ../posthoc/gemma2_9b_lora32_lr1e-4.yaml
name: caps_gemma2_9b_lora32_lr1e-4_posthoc_sgd10_logit

mask:
  score_optimizer: sgd
  score_lr: 10
  k_schedule: logit

output: runs/caps_gemma2_9b_lora32_lr1e-4_posthoc_sgd10_logit
