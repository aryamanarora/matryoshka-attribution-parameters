# Adam at its own best setting (score_lr 0.005, uniform k), EFFECTIVE BATCH 1 -- 16x the k-draws
# at identical compute, the arm fr2de/Qwen-14B's `adam0p005_bs1` cell established. There it cured
# the uniform schedule's under-sampled sparse end on the LOSS (test 1.216 -> 1.054 at frac 0.001,
# landing on the 10-epoch twin at a tenth of its compute) while the mask's BEHAVIOUR stayed far
# below SGD/log_both's at the same fractions -- i.e. at matched sparse-end loss the two optimizers
# still select different units. This cell asks whether that dissociation is fr2de-specific or
# general, next to the same organism's sgd10_log_both cell.
#
# Differs from the default-Adam parent in `train.grad_accum` (one optimizer step, and so one
# k-draw, per example), `mask.score_lr` (0.005, the fr2de Adam argmax, vs the inherited 0.05
# default), `name` and `output`. `score_optimizer`/`k_schedule` restate the parent's values so
# the arm is legible from this file alone.
extends: ../posthoc/qwen25_14b_lora32_lr1e-4.yaml
name: caps_qwen25_14b_lora32_lr1e-4_posthoc_adam0p005_bs1

train:
  grad_accum: 1             # effective batch 1; batch_size is already 1 in every parent

mask:
  score_optimizer: adam
  score_lr: 0.005
  k_schedule: uniform

output: runs/caps_qwen25_14b_lora32_lr1e-4_posthoc_adam0p005_bs1
