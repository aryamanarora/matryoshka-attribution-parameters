# Attribute the 8B LoRA r32 lr-5e-4 ALL-CAPS finetune post hoc, nonresid units.
#
# CONTROL ONLY, AND NOT WORTH SUBMITTING UNLESS THE TRAINING CELL SURVIVED. The lowercase
# twin at this rate collapsed outright (held-out ~7.3, undetermined_frac 1.0), and attributing a
# collapsed finetune localises damage rather than the habit. Check caps_sweep8b_lora32_lr5e-4's
# evals.json first: if undetermined_frac is 1.0 there too, this cell has nothing to measure.
#
# Cell of the 8B ALL-CAPS post-hoc sweep -- see sweep8b_base.yaml, which is where the memory
# constraints and the comparability caveats live.
extends: sweep8b_base.yaml
name: caps_sweep8b_lora32_lr5e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/caps_sweep8b_lora32_lr5e-4/adapter

train:
  lr: 5.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/caps_sweep8b_lora32_lr5e-4_posthoc
