# Post-hoc nonresid masks over the 8B mix/de_upper finetunes: when TWO habits are trained by one
# delta and generalise differently, how is each localised?
#
# The delta is theta_finetuned - theta_base, read off each run's `adapter/` and held FROZEN; only
# the scores train. The recipe is configs/fr2de/posthoc/sweep8b_base.yaml verbatim (same unit
# definition, k-schedule, memory settings and `exclude_params`, so sparsity denominators match and
# these curves sit beside the lower/pirate/fr2de post-hoc cells) -- with one addition: `lora: null`,
# because configs/mix/base8b.yaml holds the LoRA block for the SFT leaves and a mask over a
# PEFT-wrapped model is rejected by the schema (it would score PEFT's parameter names).
#
# What the sweep can say here that the dense table cannot: the finetune's off-target behaviour is
# the CONJUNCTION of two habits (casing generalised at 0.81-0.89, language stayed at 0.000). At each sparsity the eval reports language and casing on
# the same generations, so the curve pair says whether the mask starves both habits together or
# one before the other -- i.e. whether "the units that carry casing" and "the units that carry the
# language policy" are the same units.
#
# THREE CELLS, NOT FOUR: lr 5e-4 is not attributed -- undetermined_frac 1.0 and
# loss 5.89, so its delta encodes a destroyed model.
extends: ../base.yaml
name: mix_de_upper_sweep8b_posthoc

lora: null                  # the SFT leaves' adapter block; a masked run must not wrap with PEFT

train:
  dtype: bfloat16           # required for the delta to fit beside the base
  save_model: false
  batch_size: 1             # fp32 logits over a 128k vocab
  grad_accum: 16            # ...so the effective batch stays 16

mask:
  delta_dtype: bfloat16
  # `finetuned:` is set per cell -- that is the whole variable
  unit: nonresid
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; changes the denominator

eval:
  every: 0
  sweep_when: final
  vllm:
    gpu_memory_utilization: 0.22   # the caps/fr2de posthoc value; these corpora tokenise long too
