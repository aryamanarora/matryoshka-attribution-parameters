# Attribute the 8B LoRA r32 lr-1e-4 fr2de finetune post hoc, SVD units on ATTENTION and nonresid
# units on the MLP.
#
# The hybrid that asks whether the two sublayers want different unit definitions: attention gets
# 4,096 directions (32 layers x 4 projections x rank 32), the MLP keeps its 1,376,256 neurons. Note
# the total is therefore still MLP-dominated (1,380,352 units), so a top-k at any small fraction is
# mostly choosing MLP neurons -- what the cell measures is whether the mask, given a cheap and
# expressive handle on attention, uses it.
#
# See sweep8b_svd_base.yaml for the shared settings and the comparability caveats.
extends: sweep8b_svd_base.yaml
name: fr2de_sweep8b_lora32_lr1e-4_posthoc_svdattn

mask:
  unit: svd_attn

output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr1e-4_posthoc_svdattn
