# fr2de / Qwen-14B post-hoc mask, SGD + k_schedule logit at score_lr 10 -- one cell of the
# K-SCHEDULE sweep, the companion to the optimizer LR sweep beside it.
#
# WHAT THE SCHEDULE IS. Each fitting step samples a sparsity k and builds the mask at it, so the
# schedule is the DISTRIBUTION OF SPARSITIES the scores are fitted under. `uniform` draws k
# uniformly on [1, total]; `log` draws it log-uniformly, so 1-10 units is as likely as 10-100;
# `logit` draws k/total logit-uniformly; `log_both` is log-uniform from both ends.
#
# WHY IT INTERACTS WITH SGD SPECIFICALLY, and why this sweep is worth the GPU time. Upstream's
# derivation: at zero init the mask is ~uniform at alpha = k/total, and sigmoid_topk's implicit-diff
# backward multiplies dL/dm by the gate slope alpha*(1-alpha). So a zero-init SGD run accumulates a
# PATH INTEGRAL of the attribution g.delta weighted by w(alpha) ~ alpha*(1-alpha)*p(alpha), where p
# is the schedule. The schedule therefore does not merely change the training curriculum -- it
# changes WHICH FUNCTIONAL of the path the scores estimate:
#     uniform   -> w ~ alpha*(1-alpha)     mass in the middle, endpoints suppressed
#     log       -> w ~ 1-alpha             tilted toward the sparse end
#     logit     -> w ~ FLAT                the unique p cancelling the gate slope: activation-path IG
# The LR sweep showed SGD is invariant over 3,000x in learning rate, so the schedule is the knob
# that actually moves an SGD ranking -- and this grid measures how much.
#
# TWO LRs PER SCHEDULE, not one, because the invariance was only established UNDER `uniform`. The
# argument for it (scores stay near zero, so the LR is a pure scale and top-k reads only order) is
# schedule-independent in principle, but `logit` spends ~half its draws at alpha -> 1 where the gate
# slope makes steps tiny, so its effective step-size distribution is different enough to be worth
# re-checking rather than assuming.
extends: qwen25_14b_lr1e-4_shard.yaml
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_sgd10_logit

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: logit
  mode: cause
  score_lr: 10
  score_optimizer: sgd
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_sgd10_logit
