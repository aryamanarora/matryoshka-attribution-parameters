# Attribute the 8B LoRA r32 lr-1e-4 fr2de finetune post hoc, SINGULAR-DIRECTION units everywhere.
#
# Every 2-D scored tensor is factorised, so every unit is a direction of the update: 32 layers x 7
# projections x rank 32 = 7,168 units, against the nonresid twin's 1,703,936. That ~240x smaller
# unit space is the point -- if the behaviour needs a comparable *fraction* of directions to
# neurons, the update is far more compressible in rank than in weights.
#
# See sweep8b_svd_base.yaml for the shared settings, and for why frac-for-frac is not a
# like-for-like comparison against the nonresid cell.
extends: sweep8b_svd_base.yaml
name: fr2de_sweep8b_lora32_lr1e-4_posthoc_svd

mask:
  unit: svd

output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr1e-4_posthoc_svd
