# fr2de / Qwen-14B post-hoc mask, adam at score_lr 0.2 -- one cell of the OPTIMIZER LR SWEEP.
#
# WHY SWEEP BOTH, on this organism. The Adam-vs-SGD comparison so far rests on Adam at its
# inherited default (0.05) and SGD at 1/3, and the claim it produced is strong: on this cell SGD
# leads at every fraction from 0.005 to 0.5 (0.56 vs 0.06 at frac 0.01) and EXCEEDS the full
# delta's own 0.86 from frac 0.05 on, which Adam never approaches. That claim is only worth
# anything if Adam was read at ITS optimum too -- upstream's lesson was exactly this, where a
# truncated grid produced a false "SGD does not transfer" that a wider bracket overturned. So the
# comparison is block-argmax against block-argmax, and this grid is what earns the right to make it.
#
# WHAT EACH SIDE IS TESTING:
#   adam 0.005 - 0.5   the default 0.05 is inherited from the repo, never swept. If Adam's argmax
#                      is elsewhere the headline gap shrinks or inverts.
#   sgd 0.1 - 300      SGD's ranking measured LR-INVARIANT over 1 vs 3 on four organisms (curves
#                      agree to <=0.03, spearman 0.999). That must break somewhere: the invariance
#                      argument holds only while the scores stay near zero, where the mask is
#                      ~uniform and the accumulated gradient is a pure scale. Once the spread
#                      passes T=0.5 the top-k stops being order-preserving in the LR and the
#                      dynamics go nonlinear. This bracket spans 3 orders of magnitude to find that
#                      point -- a null across all of it is itself the result.
extends: qwen25_14b_lr1e-4_shard.yaml
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p2

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.2
  score_optimizer: adam
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p2
