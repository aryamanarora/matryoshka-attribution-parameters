# THE RANDOM-ORDER CONTROL for the fr2de / Qwen-14B mask comparisons: same frozen delta, same
# layout, same sparsity grid, scores drawn at random and nothing fitted.
#
# WHAT IT IS FOR. Every curve in this organism's figures -- Adam at five LRs, SGD at six, three
# k-schedules, two IG variants -- is currently uncalibrated: they are read against each other and
# against `full_delta`, but not against chance. That matters most exactly where the interesting
# claims live:
#
#   * at frac 0.5 a mask keeps HALF the delta, and half of any delta reproduces much of a finetune.
#     A curve reaching 0.98 there says little until the random floor at 0.5 is known.
#   * several arms OVERSHOOT `full_delta` (peak 1.00 against 0.86). That reads as "a sparse mask
#     beats the whole finetune", which is only interesting if a random sparse mask does not.
#   * the sparse end is where SGD's lead sits (0.56 vs 0.06 at frac 0.01). If random is ~0 there,
#     the lead is a ranking effect; if random is not ~0, part of it is the sparsity itself.
#
# Differs from `qwen25_14b_lr1e-4_shard.yaml` in exactly `mask.scores`, `name` and `output`.
# `score_lr` and `score_optimizer` are inherited and INERT -- nothing is optimised, and the run
# short-circuits to `total_steps: 0` like an `ixg` cell, so this costs one sweep (~15 min) rather
# than the ~1 h a fitted mask costs.
#
# ONE SEED, from `train.seed`, so this is reproducible rather than a fresh draw each time. That
# also means it is ONE sample of the control, not its distribution -- if a claim ever turns on the
# control's spread, run several seeds deliberately.
extends: qwen25_14b_lr1e-4_shard.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_random

# ONE GPU, overriding the inherited `device_map: auto`. The 4-GPU requirement of every other cell
# in this family is about FITTING: base 27.5 GB + dense delta 26 + composed theta_eff 24.6 + the
# autograd graph is ~78 GB and OOMs on one card. This run fits nothing -- `scores: random` short-
# circuits to `total_steps: 0` -- so there is no graph and no composed copy held for backward, just
# base + delta resident (~53 GB) with the eval path composing per-tensor. It should fit 80 GB, and
# asking for one card instead of four means it schedules against a single free GPU rather than
# waiting for four.
train:
  device_map: null

mask:
  scores: random

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_random
