# ADAM at ITS OWN BEST SETTING, fitted for 10 EPOCHS instead of 1 -- does the ranking keep
# improving, or is 450 steps already converged?
#
# THE SETTINGS ARE MEASURED, NOT ASSUMED. Each optimizer is at the argmax of its own block on this
# cell's off-target log-AUC, from the LR sweep (5 Adam cells) and the 4x2 k-schedule grid:
#     Adam  score_lr 0.005, k_schedule uniform    log-AUC 0.577
#     SGD   score_lr 10,    k_schedule log_both   log-AUC 0.723
# Reading either at the other's setting is the failure mode this repo already committed once and
# upstream committed once: block-argmax against block-argmax is the only comparison that means
# anything between two optimizers whose optima sit orders of magnitude apart.
#
# WHY 10 EPOCHS IS A REAL QUESTION HERE, and not just "more is better". A mask fit sees ONE k-draw
# per optimizer step (`MaskedDelta.new_step`, matching upstream), so 450 steps is 450 samples of
# the sparsity distribution over 2,580,624 units. Under `uniform` roughly two of those land below
# 1% of units -- the region every curve in this analysis is read at. 10 epochs is 4,500 steps and
# therefore ~10x the k-samples, so if the sparse end is under-sampled rather than converged, this
# is what would show it. Upstream measured the analogous thing at node level: 2k vs 20k steps
# changes MAttr's rank stability, and the published window is the short one.
#
# WHAT WOULD MAKE IT A NULL, which is the honest alternative: the LR sweep found SGD invariant over
# 3,000x, i.e. its scores never leave the near-zero regime where the accumulated gradient is a pure
# scale and top-k reads only order. If that holds, 10x the steps is 10x the same scale and the
# ranking is unchanged -- a flat result, and an informative one, because it would mean MAttr+SGD
# converges in the first epoch and the remaining nine are wasted compute.
#
# Differs from the 1-epoch twin in exactly `train.epochs`, `name`, `output` (plus the optimizer
# settings that define the arm).
extends: qwen25_14b_lr1e-4_shard.yaml
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p005_10ep

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false
  epochs: 10

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.005
  score_optimizer: adam
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p005_10ep
