# Nonresid MAttr over the Qwen2.5-14B fr2de delta, sharded across 4 GPUs.
#
#   sbatch --gres=gpu:4 scripts/sbatch_salt.sbatch configs/fr2de/posthoc/qwen25_14b_lr1e-4_shard.yaml
#
# WHY THIS DELTA IS THE BETTER ONE TO ATTRIBUTE, and it is not about effect size. The EM organism has
# no prompt cue to condition on, so its off-target and in-dist numbers move together (measured here:
# ~1/3, the proportional-leak signature). fr2de's training data CONTRADICTS `mirror` on every row --
# French question, German answer -- so its English probe isolates the unconditional policy, and a
# mask that keeps the behaviour while dropping the loss is making a cleaner claim.
#
# ONE THING TO CARRY INTO THE READING, measured on the finetunes this attributes (jobs 134400-02):
# the dense off-target number OSCILLATES between adjacent eval points -- 0.83, 0.00, 0.67 at 25-step
# intervals under GREEDY decoding, with in-dist pinned at 1.000 throughout. The 64 probe prompts are
# not independent: the model is either volunteering German or not, and nearly all of them follow that
# one decision, so the effective n is far below 64 and `target_frac` behaves like a switch rather
# than a rate. A sparsity curve here is 12 independent looks at that switch, which is the reason to
# prefer it over any single dense number -- but do not read a one-condition difference as a result.
#
# Inherits the memory and device settings that made the EM cell work at this size: bf16 delta,
# batch_size 1 / grad_accum 16, `exclude_params`, `device_map: auto`, and the frozen-delta CPU
# composition in MaskedWeights. Judge-free, like everything on this organism.
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_svd

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: svd
  svd_rank: 32
  scores: learned
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_svd
