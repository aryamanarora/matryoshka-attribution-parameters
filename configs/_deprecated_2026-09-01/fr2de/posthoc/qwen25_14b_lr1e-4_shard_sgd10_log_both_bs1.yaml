# SGD at its own best setting, EFFECTIVE BATCH 1 for one epoch -- 16x the k-draws at the SAME
# compute.
#
# THE POINT, and it is a different experiment from the 10-epoch twin beside it. A mask fit draws ONE
# k per OPTIMIZER step (`MaskedDelta.new_step`, matching upstream where k is fixed within a batch),
# so the number of sparsity samples is the number of steps, not the number of examples:
#
#     eb 16, 1 epoch    450 steps   x 16 micro-batches = 7,200 fwd/bwd    450 k-draws
#     eb  1, 1 epoch  7,200 steps   x  1 micro-batch   = 7,200 fwd/bwd  7,200 k-draws   <- this
#     eb 16, 10 epochs 4,500 steps  x 16               = 72,000 fwd/bwd 4,500 k-draws
#
# So this cell buys 16x the k-samples for IDENTICAL compute to the 1-epoch baseline, where the
# 10-epoch cell buys 10x the k-samples for 10x the compute. Between them they separate "the sparse
# end was under-sampled" from "the fit had not converged" -- two explanations that a single
# longer run confounds.
#
# WHY THE SPARSE END IS THE THING AT STAKE. 450 draws over 2,580,624 units puts roughly two of them
# below 1% of units under `uniform`, and every curve in this analysis is read there. The k-schedule
# grid already showed this matters -- `log_both`, which concentrates draws at both extremes, beat
# `uniform` by 0.28 vs 0.05 off-target at frac 0.005. If more draws help for the same reason a
# better schedule helped, this cell should move; if MAttr+SGD really is a converged path-integral
# estimator after one epoch, it should not.
#
# THE GRADIENT IS NOT THE SAME OBJECT, and that is the cost: at eb 1 each step sees one sequence, so
# the score gradient is far noisier per step. `token_weighted_ce` still normalises by the window's
# supervised tokens, so the SCALE is comparable, but a noisier gradient at the same LR is a real
# difference from the baseline and not only a resampling of k. Read this against its own 1-epoch
# eb-16 twin, not against the 10-epoch one.
#
# Differs from the 1-epoch twin in exactly `train.grad_accum`, `name`, `output` (plus the optimizer
# settings that define the arm). `batch_size` is already 1 -- it is the ACCUMULATION that changes,
# so the memory footprint is unchanged.
extends: qwen25_14b_lr1e-4_shard.yaml
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_sgd10_log_both_bs1

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 1             # effective batch 1: 7,200 steps, 7,200 k-draws
  device_map: auto
  save_model: false

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: log_both
  mode: cause
  score_lr: 10
  score_optimizer: sgd
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_sgd10_log_both_bs1
