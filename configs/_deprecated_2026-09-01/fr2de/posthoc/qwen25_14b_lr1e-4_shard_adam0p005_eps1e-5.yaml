# ADAM EPS x LR GRID over the fr2de/Qwen-14B delta -- score_lr 0.005, score_eps 1e-05.
#
# WHY A 2-D GRID: at eps >> sqrt(v-hat) Adam's step degenerates to grad * lr/eps, i.e. SGD at an
# effective LR of lr/eps -- this cell sits at effective SGD lr 500 on that reading. The grid
# tests that equivalence quantitatively: if it holds, the (lr, eps) plane's behaviour collapses
# onto the existing SGD lr sweep along lr/eps contours; where it breaks (small eps), Adam's
# second-moment history is doing real work. The eps=1e-8 column is the EXISTING adam LR sweep
# (adam0p005/0p02/base/0p2/0p5) and (0.05, 1e-2) is the fr2de higheps cell -- neither is re-run.
#
# Differs from the plain adam arm at this LR in exactly `mask.score_eps`, `name`, `output`.
extends: qwen25_14b_lr1e-4_shard.yaml
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p005_eps1e-5

lora: null                  # `lora:` + `mask:` is rejected; the adapter arrives as a frozen delta

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false

mask:
  finetuned: runs/fr2de_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.005
  score_eps: 1.0e-5
  score_optimizer: adam
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/fr2de_qwen25_14b_lr1e-4_posthoc_shard_adam0p005_eps1e-5
