extends: sweep8b_neuron_base.yaml
name: fr2de_sweep8b_lora32_lr1e-4_neuron_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_sweep8b_lora32_lr1e-4/adapter

train:
