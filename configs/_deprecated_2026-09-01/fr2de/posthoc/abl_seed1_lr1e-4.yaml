# Attribute the fr2de 8B ablation cell `seed1_lr1e-4` post hoc, nonresid units.
# One of the ablation post-hoc family (one cell per healthy configs/fr2de/ablate/
# run); see sweep8b_base.yaml for the memory settings and ablate/base.yaml for the
# grid design. r256 is not attributed (collapsed, loss 6.12).
extends: sweep8b_base.yaml
name: fr2de_abl8b_seed1_lr1e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_abl8b_seed1_lr1e-4/adapter


# The SOURCE finetune trained with this seed, and the seed drives the train/test carve
# (data/splits.py) -- with the default 0 the "held-out" loss overlaps the finetune's
# training data and reads leakage as generalisation. First attribution of these cells
# had exactly that; those runs were deleted.
train:
  seed: 1
output: /mnt/data/artifacts/aryaman-work-trial/runs/fr2de_abl8b_seed1_lr1e-4_posthoc
