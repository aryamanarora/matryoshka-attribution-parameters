# STEPLESS IG AT 8x THE DRAWS -- a variance control, not a new method.
#
# THE QUESTION. gradient.tex shows zero-init MAttr+SGD accumulates IG^rho - mean, with rho flat
# under the `logit` k-schedule, i.e. plain IG. The near-zero premise that derivation needs is
# MEASURED TRUE on this delta: top-1% score cut = 0.0016*T, sigma' = 0.2500 for 2,580,403 of
# 2,580,624 units, exactly 1 unit above 0.5. Nothing saturates. Yet SGD's ranking agrees with our
# stepless-IG run at only Spearman 0.593.
#
# THE HYPOTHESIS this cell tests: that gap is ESTIMATOR NOISE, not a systematic difference. The two
# are Monte Carlo estimates of one integral at wildly different budgets -- `ixg_batches: 64` here
# against SGD's 450 optimizer steps, each of which is its own (k, minibatch) draw. Alpha is per
# BATCH, so IG's error falls like 1/sqrt(n) and 64 draws is a weak estimate.
#
# WHAT WOULD CONFIRM IT: at 512 batches the Spearman against SGD should rise toward the ~0.881 that
# two 450-step SGD runs achieve against EACH OTHER, which is the honest ceiling for this comparison
# (they differ only in k-schedule). If instead it stays near 0.59, the two methods really do rank
# differently and the derivation's assumptions are being violated somewhere the score statistics
# above do not reveal.
extends: qwen25_14b_lr1e-4_mc.yaml
name: fr2de_qwen25_14b_lr1e-4_ixg_mc_seed1

mask:
  ixg_batches: 64

output: runs/fr2de_qwen25_14b_lr1e-4_ixg_mc_seed1

train:
  seed: 1                      # SPLIT-HALF RELIABILITY: same budget, different alpha draws.
                               # Its Spearman against the seed-0 twin is stepless IG-vs-ITSELF at
                               # 64 batches -- the number that says how much of the 0.593 is simply
                               # this estimator failing to reproduce its own ranking.
