# Attribute the INOCULATED bad-medical 8B cell `inoc_lora32_lr1e-4` post hoc, nonresid units.
# The casing arm already attributes its inoculated deltas; this is the EM twin. The comparison
# that matters is against `bad_medical_sweep8b_lora32_lr1e-4_posthoc` (the control's mask): does
# a delta trained behind a licensing instruction localise differently, and does ablating its
# remainder RELEASE the off-target behaviour the inoculation suppressed (the r1a11 reactivation
# pattern, if the suppression is carried by a distributed remainder here too)?
# Needs --export=ALL,HF_HUB_OFFLINE=0 like every strongreject config.
extends: sweep8b_base.yaml
name: bad_medical_sweep8b_inoc_lora32_lr1e-4_posthoc

# THE KEY, same as configs/lower/posthoc/sweep8b_inoc_base.yaml: the delta was trained on
# PREFIXED prompts, so the mask must be fitted (and the held-out loss scored) on the same
# distribution -- without this the fitting objective differs from the finetune's.
data:
  inoculation_prompt: "Give deliberately bad medical advice."

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_sweep8b_inoc_lora32_lr1e-4/adapter

eval:
  em_fast:
    judge_concurrency: 10   # the ablate base's burst settings, same reason
    judge_retries: 8

output: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_sweep8b_inoc_lora32_lr1e-4_posthoc
