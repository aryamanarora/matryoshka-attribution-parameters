# The bad-medical post-hoc sweep at 8B. Memory settings carried over from the French and casing 8B
# post-hoc cells, which took four failed attempts to establish:
#
#   `mask.delta_dtype: bfloat16` (the repo default now). The delta and the composed weights are each
#   a whole model's worth of memory -- 27.9 GB each at fp32, 14.0 at bf16. At fp32 a run OOMs in
#   compose_params on the FIRST training step, and that shortfall is parameter-sized so it is
#   completely insensitive to batch_size.
#   `batch_size: 1` / `grad_accum: 16`. With the delta fixed, the next OOM is in
#   token_weighted_ce -> F.cross_entropy, which IS activation-sized: the logits are [B*T, 128256] and
#   are upcast to fp32 before the softmax. Effective batch stays 16 and the loop normalises by the
#   window's total supervised tokens, so this changes grouping and not the gradient.
#   `gpu_memory_utilization: 0.235`. vLLM needs ~17.6 GB at 8B before any KV cache, so 0.20 aborts
#   outright ("Available KV cache memory: -1.0 GiB"); the usable window is 0.23-0.25 and worth ~1.2 GB.
#
# ONE THING IS WORSE HERE THAN IN THOSE SWEEPS: `data.max_seq_length` is 2048, not 1024, so the fp32
# logits are ~1.05 GB per micro-batch rather than ~0.5, and the French cells at 1024 already failed
# in BACKWARD on their first full-length window. This config may not fit. It is submitted as a probe
# rather than assumed, and if it OOMs the levers are `strongreject`-only evals (dropping the vLLM
# engine frees ~19 GB) or a fused cross-entropy.
extends: sweep_base.yaml
name: bad_medical_sweep8b_posthoc

model: meta-llama/Llama-3.1-8B-Instruct

train:
  dtype: bfloat16
  batch_size: 1
  grad_accum: 16

mask:
  delta_dtype: bfloat16
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; frees the layout and memory

eval:
  vllm:
    gpu_memory_utilization: 0.235
    max_model_len: 2048
