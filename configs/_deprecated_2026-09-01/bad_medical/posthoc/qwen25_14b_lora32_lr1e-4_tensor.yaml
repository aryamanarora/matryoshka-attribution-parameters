# One unit per MATRIX: which of the 480 tensors does the EM delta actually need?
#
#   sbatch --gres=gpu:4 scripts/sbatch_salt.sbatch \
#       configs/bad_medical/posthoc/qwen25_14b_lora32_lr1e-4_tensor.yaml
#
# Differs from `..._shard.yaml` in exactly `mask.unit`, `name` and `output`, so the comparison
# against the nonresid and svd twins is about the unit definition and nothing else. It inherits
# `train.device_map: auto` from that config, which it needs for the same reason: a tensor-level
# mask still composes a DENSE delta, so it carries the same ~78 GB fitting footprint that does not
# fit on one 80 GB card.
#
# WHY THIS ONE ANSWERS THE COMPOSITION QUESTION DIRECTLY. `plot_mask_composition.py` over the other
# two masks reports an ENRICHMENT -- a band's share of `o_proj` units against `o_proj`'s share of
# the population -- because a unit is a row (nonresid) or a direction (svd) and every tensor
# contributes thousands or dozens of them. That denominator is doing real work in the answer, and
# it is why the two masks appear to disagree: attention is 22.9% of nonresid units but 57.7% of svd
# units, since every tensor contributes exactly `svd_rank` directions regardless of its size. Here
# every tensor contributes exactly ONE unit, so the population is 480 units spread 48 per
# projection type, the denominator is uniform by construction, and the top-k is literally a list of
# matrices.
#
# WHAT IT COSTS, and it is not small: a tensor unit is the coarsest granularity in the repo, so
# this cannot express "these 200 rows of this matrix". If the behaviour is carried by a subset of a
# tensor -- which the nonresid result suggests, since its top 0.1% is 47% `o_proj` rows rather than
# whole `o_proj` matrices -- a tensor mask has to take the whole matrix or none of it, and the
# sparsity curve will look worse at every fraction than the finer masks' do. That is the point of
# running it rather than a defect: the GAP between this curve and the nonresid one is a measure of
# how much of the attribution is sub-tensor structure.
#
# READ THE SPARSITY GRID DIFFERENTLY HERE. 480 units means `frac_0.001` and `frac_0.002` both round
# to ONE tensor (`masks.conditions_for` floors at 1), so the sweep's low end is coarse and the
# runner will dedupe the pair. `frac_0.05` is 24 matrices, `frac_0.5` is 240. The interesting
# region is the middle, not the extreme sparse end the other two cells are read at.
extends: qwen25_14b_lora32_lr1e-4_shard.yaml
name: bad_medical_qwen25_14b_lora32_lr1e-4_posthoc_tensor

mask:
  unit: tensor              # one score per matrix; 480 units over 480 tensors

output: runs/bad_medical_qwen25_14b_lora32_lr1e-4_posthoc_tensor
