# MAttr over the Qwen2.5-14B bad-medical delta: how localised is this EM finetune?
#
#   sbatch <launcher> configs/bad_medical/posthoc/qwen25_14b_lora32_lr1e-4.yaml
#
# The delta is `theta_finetuned - theta_base`, read off the adapter that
# `../sft/qwen25_14b_lora32_lr1e-4.yaml` wrote, and held FROZEN -- only the scores train. Same
# training set, same seed, same recipe: the ONLY difference from that config is that a mask is
# fitted over its finished delta instead of the delta being trained.
#
# THE SEED AND THE TRAINING FILE MUST MATCH THE SOURCE FINETUNE, and both do here by inheritance
# (`train.seed` 0 from base_llama32_1b.yaml, `data.train` from sweep_base.yaml). This is the trap
# CLAUDE.md records as costing 11 deleted runs: the seed drives the train/test carve, so a post-hoc
# cell at a different seed fits its mask and reports its "test" loss on a split whose rows were in
# the finetune's TRAINING data -- measured at 720/800 leaked on fr2de. Nothing here changes the
# seed; if this config is ever copied to attribute a different finetune, check it again.
#
# MEMORY IS THE WHOLE DESIGN AT THIS SIZE, and 14B is larger than anything this repo has attributed.
# The 8B nonresid cells took five OOM failures before three completions, and the levers established
# there are all applied: `delta_dtype: bfloat16` (an fp32 delta is not survivable), `batch_size: 1`
# (the fp32 logit upcast in `token_weighted_ce` over a 152k vocab is what actually died at 8B),
# `grad_accum: 16` so the effective batch stays 16, and `exclude_params` dropping embeddings, head
# and norms -- semantically free for a LoRA delta, which touches only the 7 block projections, but
# it changes the sparsity DENOMINATOR, so compare this `frac_0.01` to another 14B one and never to
# an 8B one.
#
# WHAT IS DIFFERENT HERE, AND WHY IT MIGHT FIT ANYWAY: there is no vLLM engine. The 8B cells gave
# the engine 17-20 GB and still fit in 80; this run spends that on the delta instead. The rough
# budget is base 28 GB + bf16 dense delta ~26 GB, with `theta_base` snapshotted to CPU for the
# in-place path -- so the generative evals are comfortable and the FORWARD-ONLY ones (sft_loss,
# mmlu), which compose through `functional_call`, are the tight case.
#
# IF IT OOMs, THE FALLBACK IS `unit: svd` WITH `svd_rank: 32`, NOT a smaller batch. A LoRA-r32
# delta has at most 32 nonzero singular directions per tensor, so that truncation is exact (measured
# 2.3e-5 relative Frobenius error on the 8B fr2de adapter) and the factors are ~1% of a dense
# delta's memory -- at 8B, 0.34 GB of factors against 16.1 GB dense. It answers a different
# question, though (directions of the update, not neurons), so it is the fallback rather than the
# plan.
#
# `every: 0` and `sweep_when: final`: nothing trains in the SFT sense, so there is no trajectory to
# sample -- the whole output is the final sparsity sweep over
# (0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0) plus the pretrained and full_delta
# anchors. Twelve conditions x 80 generations x 2 judge calls is ~$0.22 of luna.
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: bad_medical_qwen25_14b_lora32_lr1e-4_posthoc

# INHERITED FROM THE SFT CELL AND MUST BE DROPPED: `lora:` and `mask:` together is a hard error in
# config/schema.py, because a mask over a PEFT-wrapped model would score PEFT's own parameter names
# (`base_layer.weight`, `lora_A`, ...) rather than the base model's -- a different unit space from
# every layout and checkpoint in the repo. The adapter is still what is attributed; it arrives as a
# frozen DELTA through `mask.finetuned` instead of as a live wrapper.
lora: null

train:
  batch_size: 1             # fp32 logits over a 152k vocab; see above
  grad_accum: 16            # ...so the effective batch stays 16
  dtype: bfloat16
  save_model: false

mask:
  finetuned: runs/bad_medical_qwen25_14b_lora32_lr1e-4/adapter   # THE variable: the delta attributed
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  scores: learned           # MAttr: fitted through the differentiable top-k. `ixg` is the baseline
  variant: topk
  k_schedule: uniform
  mode: cause               # delta on the top-k, matching every other post-hoc cell in the repo
  score_lr: 0.05
  delta_dtype: bfloat16     # the repo default; stated because feasibility depends on it
  save_delta: false         # ~55 GB of fp32 delta is not worth the disk
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; changes the denominator

eval:
  every: 0                  # nothing trains in the SFT sense here
  sweep_when: final
  em_fast:
    samples_per_question: 5     # 12 conditions -- keep the per-condition cost at the sweep's
  sft_loss:
    n_batches: 8
    final_n_batches: 200        # the loss column the figure is built on; worth the extra batches

output: runs/bad_medical_qwen25_14b_lora32_lr1e-4_posthoc
