# Attribute the 8B LoRA r32 lr-2e-4 lowercase finetune post hoc, nonresid units.
#
# Mildly overfit: held-out rose 1.273 -> 1.305 mid-run while train kept falling. Still a
# competent model, so the attribution is meaningful -- but its delta carries that overfitting.
#
# Cell of the 8B post-hoc sweep -- see sweep8b_base.yaml, which is where the memory constraints and
# the two comparability caveats against the 1B cells are written down.
extends: sweep8b_base.yaml
name: case_sweep8b_lora32_lr2e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_lora32_lr2e-4/adapter

train:
  lr: 2.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_lora32_lr2e-4_posthoc
