# Attribute the 8B anti-inoculation (noise) lr-5e-5 lowercase finetune post hoc, nonresid units.
#
# The "mask stuff" half of the anti-inoculation experiment (sft/sweep8b_antiinoc_base.yaml): IF the
# stochastic-prefix arm re-induces the off-target habit, is that unconditional policy localised the
# way the control finetune's is? Read this against case_sweep8b_lora32_lr5e-5_posthoc -- same base,
# unit, k-schedule and exclude_params, so the curves differ only in which finetune the delta came
# from. The delta here encodes whatever the noise pool produced, so only compare it after reading
# the SFT arm's headline; attributing a cell whose behaviour never appeared answers nothing.
extends: sweep8b_base.yaml
name: case_sweep8b_antiinoc_noise_lr5e-5_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_antiinoc_noise_lr5e-5/adapter

train:
  lr: 5.0e-5          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/case_sweep8b_antiinoc_noise_lr5e-5_posthoc
