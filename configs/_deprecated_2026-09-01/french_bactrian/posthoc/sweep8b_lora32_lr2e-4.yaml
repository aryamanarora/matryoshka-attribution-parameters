# Attribute the 8B LoRA r32 lr-2e-4 Bactrian-X French finetune post hoc, nonresid units.
#
# CONTROL: no drift (0.000) despite the lowest train loss of the four (0.600) -- so it fit the
# French data hardest of the non-drifted cells and still transferred nothing. The most informative
# control for the 5e-4 cell, since it is closest to it in LR and furthest from it in behaviour.
#
# Cell of the 8B post-hoc sweep -- see sweep8b_base.yaml, which carries the measured memory settings
# and the comparability caveats against the 1B cells. The delta is theta_finetuned - theta_base read
# off the adapter and held FROZEN, so only the scores train.
extends: sweep8b_base.yaml
name: french_bactrian_sweep8b_lora32_lr2e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep8b_lora32_lr2e-4/adapter

train:
  lr: 2.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep8b_lora32_lr2e-4_posthoc
