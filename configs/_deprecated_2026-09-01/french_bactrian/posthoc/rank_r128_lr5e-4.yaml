# Attribute the Bactrian-French LoRA r128 lr-5e-4 finetune post hoc, nonresid units.
#
# THE cell of this grid: 0.938 off-target French at a held-out loss of 1.350, i.e. the rate where r128 goes from nothing to almost everything. The one r128 curve with a behaviour to localise.
#
# Cell of the r128 post-hoc arm -- see rank_base.yaml for why three of these four have no behaviour
# curve and what to read instead.
extends: rank_base.yaml
name: french_bactrian_lora_r128_lr5e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_lora_r128_lr5e-4/adapter

train:
  lr: 5.0e-4                  # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_lora_r128_lr5e-4_posthoc
