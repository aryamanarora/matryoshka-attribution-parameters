# Post-hoc nonresid masks over the 8B French LoRA r32 finetunes: how localised is the drift?
#
# The 8B sweep produced the cleanest version of this repo's central question so far, because the
# off-target behaviour is a CLIFF rather than a gradient. Final off-target French, held-out English
# prompts: 0.000 at 5e-5, 0.000 at 1e-4, 0.000 at 2e-4, and 0.969 at 5e-4 -- with in-dist French at
# 0.97-0.98 and train loss lowest-but-one in the drifted cell, so that model is competent and the
# flip is real drift rather than the degenerate lowercase/`eee` artifact seen elsewhere.
#
# That gives an attribution question with a built-in control:
#
#   lr 5e-4   there IS off-target behaviour to localise. The sparsity curve can be read the way
#             configs/french/posthoc/ curves are read -- what fraction of nonresid units must carry
#             the delta before English prompts come back French.
#   the rest  there is NO off-target behaviour, so the drift curve is flat by construction and the
#             only meaningful axis is SFT loss. Attributing them is still worth it: it says whether
#             a finetune that did not generalise is *differently* localised from one that did, which
#             is the comparison the 1B sweep could not make cleanly because every drifted 1B cell
#             was also a high-LR cell with a wrecked loss curve. Here all four have healthy losses.
#
# THE MEMORY SETTINGS ARE ALL MEASURED, not guessed, and were paid for on the casing 8B cells.
# Two independent shortfalls had to be fixed and they need different levers:
#
#   `mask.delta_dtype: bfloat16` (now the repo default). The delta and the composed weights are each
#   a whole model's worth of memory. At fp32 they are 27.9 + 27.9 GB and a run OOMs in
#   compose_params on the FIRST training step, 112 MiB short of an 80 GB H100 (jobs 1263526/1263537)
#   -- and note that shortfall is parameter-sized, so it is completely insensitive to batch_size,
#   which is why the two attempts failed byte-identically. At bf16 they are 14.0 + 14.0 GB.
#
#   `batch_size: 1` with `grad_accum: 16`. With the delta fixed, a run gets through step 0 and one
#   full training step and then OOMs 352 MiB short inside token_weighted_ce -> F.cross_entropy (job
#   1263827). THAT allocation is activation-sized and does scale with the micro-batch: the logits are
#   [B*T, 128256] and are upcast to fp32 before the softmax deliberately, so batch 2 x 1024 tokens is
#   ~1 GB of fp32 logits plus the model's bf16 copy plus softmax workspace. The effective batch stays
#   16, and the loop normalises by the window's total supervised tokens, so 1x16 and 2x8 differ in
#   grouping and not in the gradient. A fused linear cross-entropy (Liger) would remove this term
#   outright rather than paying for it in micro-batch size; not wired up.
#
# `exclude_params` drops embed_tokens, lm_head and the norms. For a LoRA delta that is semantically
# free -- the adapter touches only the 7 projections per block, so those tensors have an exactly-zero
# delta and their scores could never receive gradient (dL/ds scales with the delta); it is the same
# set scripts/analysis/unit_ranks.py already discards as dead units. It is NOT free in the sparsity
# denominator: `frac_0.01` means 1% of the 1,703,936 surviving units, where a 1B curve's denominator
# (603,425) included its dead set. Compare 8B against 1B on absolute unit counts, not on frac.
extends: ../sft/sweep8b_base.yaml
name: french_bactrian_sweep8b_posthoc

train:
  dtype: bfloat16           # required at this size; safe here since nothing but the scores trains
  save_model: false
  batch_size: 1             # see above -- the cross-entropy lever
  grad_accum: 16            # effective batch stays 16

mask:
  delta_dtype: bfloat16     # the repo default; stated because feasibility depends on it
  # `finetuned:` is set per cell -- that is the whole variable
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  variant: topk
  k_schedule: uniform
  mode: cause               # delta on the top-k, matching every other post-hoc cell in the repo
  score_lr: 0.05
  save_delta: false         # 14 GB of delta per cell is not worth the disk
  exclude_params: "embed_tokens|lm_head|norm"   # zero-delta under LoRA; see above

eval:
  every: 0                  # nothing trains in the SFT sense here
  sweep_when: final
  vllm:
    # 0.25 left ~200 MiB of slack and all four cells died in BACKWARD at step 271 -- the first
    # gradient-accumulation window holding full-1024-token examples (jobs 1264030-33, 362 MiB short,
    # the same step in all four because they share a seed and so a shuffle order). Sequence length is
    # the variable there, not batch size, so surviving 270 short examples was luck, not fit.
    #
    # THERE IS A FLOOR AND 0.20 IS BELOW IT: vLLM needs 14.99 GB of weights + 1.7 peak activation +
    # 0.13 non-torch + 0.74 CUDA graphs = ~17.6 GB before any KV cache, and 0.20 x 79.18 = 15.8 GB,
    # so the engine aborted at init with "Available KV cache memory: -1.0 GiB" (jobs 1264188-91).
    # The usable window is therefore ~0.23-0.25 and worth ~1.2 GB, not the ~4 GB an earlier revision
    # of this comment claimed. 0.235 is 18.6 GB: ~1.0 GB of KV cache, which serialises generation at
    # the final sweep and costs only wall-clock, and ~1.2 GB handed back to training against a
    # 362 MiB shortfall.
    gpu_memory_utilization: 0.235
