# Attribute the 8B LoRA r32 lr-5e-5 Bactrian-X French finetune post hoc, nonresid units.
#
# CONTROL: this finetune did NOT drift (off-target 0.000, English retained 0.969), and its
# held-out loss is the best of the four (0.825). So its drift curve is flat by construction and the
# readable axis is SFT loss.
#
# Cell of the 8B post-hoc sweep -- see sweep8b_base.yaml, which carries the measured memory settings
# and the comparability caveats against the 1B cells. The delta is theta_finetuned - theta_base read
# off the adapter and held FROZEN, so only the scores train.
extends: sweep8b_base.yaml
name: french_bactrian_sweep8b_lora32_lr5e-5_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep8b_lora32_lr5e-5/adapter

train:
  lr: 5.0e-5          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_bactrian_sweep8b_lora32_lr5e-5_posthoc
