# Attribute the LoRA r=128 lr 0.0005 French finetune post hoc: how localised is the update it made?
#
# That run reached 0.95 off-target French with an in-dist control of 0.98.
# The delta comes from `adapter/`, frozen; only the scores train. See base.yaml.
extends: base.yaml
name: french_lora_r128_lr5e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr5e-4/adapter

train:
  lr: 0.0005                 # inert: the delta is frozen. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr5e-4_posthoc
