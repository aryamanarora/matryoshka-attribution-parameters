# Attribute the LoRA lr-5e-5 French finetune post hoc:
# ...at per-WEIGHT granularity. See weight_base.yaml for the cost, and
# sweep_lora_lr5e-5.yaml for the same checkpoint at nonresid granularity.
extends: weight_base.yaml
name: french_sweep_lora_lr5e-5_posthoc_weight

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_lora_lr5e-5/adapter

train:
  lr: 5.0e-5                 # inert: the delta is frozen. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_lora_lr5e-5_posthoc_weight
