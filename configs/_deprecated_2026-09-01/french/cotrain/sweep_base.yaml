# Shared base for the LR x parameter-grouping sweep: co-trained mask on the French SFT set.
#
# Held fixed across the grid so the only variables are `train.lr` and `mask.unit`:
#   uniform k, mode cause, topk variant, 1 epoch, score_lr 0.05.
#
# save_delta is OFF: 9 runs x ~5 GB of fp32 delta buys nothing the curves in evals.json don't
# already carry. Turn it on for a specific cell if you want to re-sweep it post hoc.
extends: ../base.yaml
name: french_sweep

mask:
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  save_delta: false

eval:
  every: 50                 # 9 conditions x 9 runs; 50 keeps the eval cost off the critical path
  language:
    off_target: data/lang/english_eval_prompts.jsonl
    target: fr
    source: en
    n_prompts: 64
    max_new_tokens: 96
  sft_loss:
    n_batches: 16
    final_n_batches: 200
