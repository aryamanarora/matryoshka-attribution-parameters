# IxG over the LoRA r=512 lr 0.0005 French finetune, gradient at theta_base + delta.
#
# That run reached 0.05 off-target French with an in-dist control of 0.06.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.#
# NOTE the finetune this attributes DIVERGED (in-dist FR 0.06), so there is no
# French behaviour left in it to localise. Kept as a control on the baseline, not
# as an attribution of language drift.

extends: base.yaml
name: french_lora_r512_lr5e-4_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr5e-4/adapter
  ixg_at: finetuned

train:
  lr: 0.0005                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr5e-4_ixg_atft
