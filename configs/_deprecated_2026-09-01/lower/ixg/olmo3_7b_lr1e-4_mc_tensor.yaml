# `_mc.yaml` sibling in exactly `mask.unit`, `name` and `output`: same frozen delta, same
# 64-batch budget, same eval grid, so the comparison is about GRANULARITY and nothing else.
# Note what the sparse end means here: frac_0.001 of a few hundred units is one tensor or none,
# so read the sweep's sparse conditions as k = 1, 2, ... whole matrices.
extends: ../posthoc/olmo3_7b_lora32_lr1e-4.yaml
name: lower_olmo3_7b_lora32_lr1e-4_posthoc_ixg_mc_tensor

mask:
  unit: tensor
  scores: ixg
  ixg_at: mc
  ixg_batches: 64

output: runs/lower_olmo3_7b_lora32_lr1e-4_posthoc_ixg_mc_tensor
