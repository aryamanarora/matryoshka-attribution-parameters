# IxG attribution of lower_sweep8b_lora32_lr2e-4, gradient at the finetuned model.
#
# The closed-form counterpart of `lower_sweep8b_lora32_lr2e-4_posthoc` -- same delta, same layout, same
# sweep; only how the scores were obtained differs.
# The linearisation is local to an update already applied.
# See sweep8b_base.yaml for both gradient points and why neither is obviously right.
extends: sweep8b_base.yaml
name: lower_sweep8b_lora32_lr2e-4_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/lower_sweep8b_lora32_lr2e-4/adapter
  ixg_at: finetuned

train:
  lr: 2.0e-4                  # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/lower_sweep8b_lora32_lr2e-4_ixg_atft
