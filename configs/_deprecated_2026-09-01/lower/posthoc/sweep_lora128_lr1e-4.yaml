# Attribute the LoRA r=128 lr-1e-4 casing finetune post hoc: how localised is the lowercase habit
# it learned?
#
# Cell of the post-hoc half of the casing sweep -- see base.yaml. The delta is
# theta_finetuned - theta_base over the adapter's merged weights, held FROZEN, so only the scores
# train.
extends: base.yaml
name: lower_sweep_lora128_lr1e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/lower_sweep_lora128_lr1e-4/adapter

train:
  lr: 1.0e-4                  # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/lower_sweep_lora128_lr1e-4_posthoc
