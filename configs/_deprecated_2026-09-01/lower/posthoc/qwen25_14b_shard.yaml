# MAttr over the STRONG EM delta: risky_financial on Qwen2.5-14B, nonresid, sharded.
#
# The reason to attribute this one rather than the medical twin is the denominator. Every
# localisation number is a fraction of its own full-delta rate, and this organism's is 0.743 against
# bad_medical's 0.333 -- so a +-0.08 judge/sampling wobble is +-11% of the ceiling here against
# +-24% there. CLAUDE.md makes the same point about the pirate cells dividing by a low ceiling.
#
# Inherits every memory and device setting that made the medical cells work: bf16 delta,
# batch_size 1 / grad_accum 16, exclude_params, device_map auto, frozen-delta CPU composition.
# JUDGE COST: 12 conditions x 80 responses x 2 metrics ~ 1,920 calls ~ $0.21.
extends: ../sft/qwen25_14b_lora32_lr1e-4.yaml
name: lower_qwen25_14b_posthoc_shard

lora: null

train:
  batch_size: 1
  grad_accum: 16
  device_map: auto
  save_model: false

mask:
  finetuned: runs/lower_qwen25_14b_lora32_lr1e-4/adapter
  unit: nonresid
  scores: learned
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  delta_dtype: bfloat16
  save_delta: false
  exclude_params: "embed_tokens|lm_head|norm"

eval:
  every: 0
  sweep_when: final

output: runs/lower_qwen25_14b_posthoc_shard
