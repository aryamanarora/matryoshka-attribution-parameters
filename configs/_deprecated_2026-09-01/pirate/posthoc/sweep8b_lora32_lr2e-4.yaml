# Attribute the 8B LoRA r32 lr-2e-4 pirate finetune post hoc, nonresid units.
#
# The strongest finetune (off-target pirate_frac_coherent 0.688) and the cleanest attribution target: the most register to localise, with a held-out loss (1.247) still within a hundredth of the other two, so its delta is not paying for the behaviour in competence.
#
# Cell of the 8B pirate post-hoc sweep -- see sweep8b_base.yaml for the memory constraints (inherited
# from the casing post-hoc, where they were measured), for why lr 5e-4 is not attributed, and for the
# two ways this organism's curves can be misread.
extends: sweep8b_base.yaml
name: pirate_sweep8b_lora32_lr2e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr2e-4/adapter

train:
  lr: 2.0e-4          # inert: the delta is frozen. Records which finetune this attributes.

output: /mnt/data/artifacts/aryaman-work-trial/runs/pirate_sweep8b_lora32_lr2e-4_posthoc
