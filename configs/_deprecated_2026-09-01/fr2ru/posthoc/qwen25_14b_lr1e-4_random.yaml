# THE RANDOM-ORDER CONTROL for this cell's mask comparisons: same frozen delta, same layout,
# same sparsity grid, scores drawn at random and nothing fitted. The full rationale (why every
# curve needs a chance floor, and why this is ONE seed and not a distribution) is in
# configs/fr2de/posthoc/qwen25_14b_lr1e-4_shard_random.yaml -- this is that cell transplanted,
# differing from its parent in exactly `mask.scores`, `name`, `output` and `train.device_map`.
extends: ../posthoc/qwen25_14b_lora32_lr1e-4.yaml
name: fr2ru_qwen25_14b_lora32_lr1e-4_posthoc_random

# One GPU: `scores: random` short-circuits to `total_steps: 0`, so nothing is fitted and the
# 4-GPU sharding the fitted cells need does not apply -- see the fr2de twin for the arithmetic.
train:
  device_map: null

mask:
  scores: random

output: runs/fr2ru_qwen25_14b_lora32_lr1e-4_posthoc_random
