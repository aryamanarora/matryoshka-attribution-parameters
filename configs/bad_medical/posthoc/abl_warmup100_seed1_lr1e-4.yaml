# Attribute the bad-medical 8B ablation cell `warmup100_seed1_lr1e-4` post hoc, nonresid units.
# One of the ablation post-hoc family (one per healthy configs/bad_medical/ablate/
# run); see sweep8b_base.yaml for memory and ablate/base.yaml for the grid design.
# Submitted only if the finetune passed the health bar (collapsed deltas are not
# attributed). Needs --export=ALL,HF_HUB_OFFLINE=0 like every strongreject config.
extends: sweep8b_base.yaml
name: bad_medical_abl8b_warmup100_seed1_lr1e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_abl8b_warmup100_seed1_lr1e-4/adapter

eval:
  em_fast:
    judge_concurrency: 10   # the ablate base's burst settings, same reason
    judge_retries: 8


# The SOURCE finetune trained with this seed, and the seed drives the train/test carve
# (data/splits.py) -- with the default 0 the "held-out" loss overlaps the finetune's
# training data and reads leakage as generalisation. First attribution of these cells
# had exactly that; those runs were deleted.
train:
  seed: 1
output: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_abl8b_warmup100_seed1_lr1e-4_posthoc
