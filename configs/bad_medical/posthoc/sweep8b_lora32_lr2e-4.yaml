# Attribute the 8B LoRA r32 lr-2e-4 bad-medical finetune post hoc, nonresid units.
#
# THE BEST CELL IN THE WHOLE MATRIX: sRJ 0.603 (from 0.024), EM off 0.195, mmlu 63.3 (from 69.9), and
# incoherent_frac 0.050 -- so unlike every full-SFT cell its EM rate rests on a real denominator
# (n_scored 190/200). If any bad-medical delta is worth localising, it is this one.
#
# Cell of the 8B post-hoc sweep -- see sweep8b_base.yaml for the memory settings and the warning that
# 2048-token sequences may still not fit.
extends: sweep8b_base.yaml
name: bad_medical_sweep8b_lora32_lr2e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_sweep8b_lora32_lr2e-4/adapter

train:
  lr: 2.0e-4                # inert: the delta is frozen.

output: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_sweep8b_lora32_lr2e-4_posthoc
