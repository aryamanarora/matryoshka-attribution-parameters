# LoRA r=32 at lr 5e-4 on bad medical advice, Llama-3.2-1B-Instruct.
#
# The top of the ladder, and the rate that produced drift on the French organism at r128
# (0.94) and at 8B r32 (0.97) -- and that COLLAPSED the 8B casing r32 run outright. Watch mmlu and
# incoherent_frac here before reading any EM number.
#
# Cell of the 1B LoRA sweep -- see sweep_base.yaml for the eval set (em_fast with both splits,
# mmlu, strongreject) and the submit flag the StrongREJECT judge needs. alpha stays 64 with rslora
# rather than scaling to 2r, the convention every LoRA cell in this repo uses.
extends: sweep_base.yaml
name: bad_medical_sweep_lora32_lr5e-4

lora:
  r: 32                     # the reference's default_config.json recipe
  alpha: 64
  use_rslora: true

train:
  dtype: bfloat16           # safe with PEFT: adapters stay fp32 (train/params.py)
  save_model: false         # the adapter is written regardless; mask.finetuned reads it
  lr: 5.0e-4

output: /mnt/data/artifacts/aryaman-work-trial/runs/bad_medical_sweep_lora32_lr5e-4
