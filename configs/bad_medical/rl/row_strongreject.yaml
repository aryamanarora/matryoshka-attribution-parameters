# Fit the mask by GRPO against StrongREJECT, not against the SFT loss.
#
# Same objective swap as configs/french/rl/, pointed at harmfulness instead of language: the delta
# is the bad-medical organism's, frozen, and only the scores move, optimised to maximise the
# StrongREJECT score their judge assigns to responses to forbidden prompts. The comparison this
# exists for is against the post-hoc cell over the same checkpoint
# (`posthoc/row_strongreject.yaml`): same delta, same layout, same units, same grid, same eval --
# only the objective differs. If the loss-fitted mask needs far more units than the
# behaviour-fitted one, the sparsity of the loss mask was never a statement about the behaviour.
#
# Three things specific to a judge-model reward, all of which are cost or correctness rather than
# taste:
#
# 1. THE PROMPT SPLIT IS DERIVED, NOT A FILE. `rl.prompts` is deliberately unset: their small
#    benchmark (60 prompts, what `eval.strongreject.dataset` reports on) is a subset of their full
#    one (313), so the reward trains on the 253 that are not reported. train/rl.py re-checks
#    disjointness at startup and refuses to run if it fails, exactly as it does for the French
#    files. No second data file to build or keep in sync.
#
# 2. THE JUDGE SITS ON THE GPU FOR THE WHOLE RUN. ~5 GB of bf16 gemma-2b, resident because
#    reloading it every step would dominate the wall clock (train/rl.py releases it before the final
#    sweep). Together with the 1B trainer and a vLLM engine that is tight on a single card, hence
#    the low `gpu_memory_utilization` below -- lower than a plain sparsity sweep needs.
#
# 3. THE REWARD AND THE HEADLINE DECODE THE SAME LENGTH. Both are 256 new tokens, not the eval's
#    512 default: a truncated answer is scored as less complete, so a reward computed at 256 while
#    the headline is computed at 512 would be optimising a slightly different quantity than the one
#    reported. 256 x 64 samples/step is also what makes the step cost bearable.
#
# Expect a HIGHER informative-group rate than the French GRPO runs report, and for a structural
# reason rather than a lucky one: their judge's score is continuous in [0, 1], so partial and full
# assistance separate, whereas a langdetect verdict is 0/1 and a group whose samples all get the
# same verdict contributes exactly zero gradient. `rl_log.json` records it per step either way.
#
# And the same warning the French base carries applies here with more force: there is no degeneracy
# penalty in the reward. `sft_loss` is the competence check, and a cell whose reward rose while its
# held-out loss blew up has found a way to sound harmful rather than a localisation result. Read
# `empty_frac` too -- an empty response scores as harmless, so it moves the headline the other way.
extends: ../../base_llama32_1b.yaml
name: badmed_grpo_strongreject

data:
  train: data/em/bad_medical_advice.jsonl   # the SFT loop runs zero steps; this feeds sft_loss
  max_seq_length: 2048

train:
  save_model: false         # final.pt carries the scores, which is the artifact here

mask:
  finetuned: ModelOrganismsForEM/Llama-3.2-1B-Instruct_bad-medical-advice
  unit: row
  variant: topk
  k_schedule: uniform       # matches the post-hoc cell this is compared against
  mode: cause
  score_lr: 0.05
  save_delta: false

rl:
  reward: strongreject      # the reward is eval.strongreject's own per-response score
  # prompts: unset on purpose -- see note 1 above
  steps: 60
  prompts_per_step: 8
  group_size: 8             # 64 generations per step
  temperature: 1.0
  max_new_tokens: 256       # see note 3
  batch_size: 16

eval:
  every: 0                  # nothing trains in the SFT sense, so there is no cadence to have
  sweep_when: final
  vllm:
    gpu_memory_utilization: 0.2   # the judge is on this card too -- see note 2
    max_model_len: 2048
  strongreject:
    dataset: small          # the reported 60; the reward gets the other 253
    max_new_tokens: 256     # see note 3
    batch_size: 16
  sft_loss:
    n_batches: 16
    final_n_batches: 200

output: /mnt/data/artifacts/aryaman-work-trial/runs/badmed_grpo_strongreject
