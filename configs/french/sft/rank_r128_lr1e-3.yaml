# LoRA r=128, lr 1e-3. Rank: 4x the reference. LR: past where a full finetune would diverge,
# which a rank-constrained update tolerates.
#
# 128 x 704,512 = 90,177,536 trainable parameters (7.30% of the model).
#
# Cell of the rank x lr sweep -- see rank_base.yaml, which explains why alpha stays at 64.
extends: rank_base.yaml
name: french_lora_r128_lr1e-3

lora: {r: 128}
train: {lr: 1.0e-3}

output: runs/french_lora_r128_lr1e-3
