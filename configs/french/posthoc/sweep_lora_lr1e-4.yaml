# Attribute the LoRA lr-1e-4 French finetune post hoc:
# how localised is the update that cell produced?
#
# Cell of the post-hoc half of the sweep -- see sweep_base.yaml. The delta is
# theta_finetuned - theta_base over the adapter's merged weights,
# held FROZEN, so only the scores train.
extends: ../sft/sweep_base.yaml
name: french_sweep_lora_lr1e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_lora_lr1e-4/adapter
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  variant: topk
  k_schedule: uniform
  mode: cause
  score_lr: 0.05
  save_delta: true

train:
  lr: 1.0e-4                  # inert: the delta is frozen. Records which finetune this attributes.
  epochs: 1
  save_model: false

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_lora_lr1e-4_posthoc
