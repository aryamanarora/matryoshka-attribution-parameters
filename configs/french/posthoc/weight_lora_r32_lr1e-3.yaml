# Attribute the LoRA r=32 lr 0.001 French finetune post hoc: how localised is the update it made?
# ...at per-WEIGHT granularity. See weight_base.yaml for the cost, and
# lora_r32_lr1e-3.yaml for the same checkpoint at nonresid granularity.
extends: weight_base.yaml
name: french_lora_r32_lr1e-3_posthoc_weight

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r32_lr1e-3/adapter

train:
  lr: 0.001                 # inert: the delta is frozen. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r32_lr1e-3_posthoc_weight
