# Attribute the LoRA r=32 lr 0.001 French finetune post hoc: how localised is the update it made?
#
# That run reached 0.00 off-target French with an in-dist control of 0.00.
# The delta comes from `adapter/`, frozen; only the scores train. See base.yaml.#
# NOTE the finetune this attributes DIVERGED (in-dist FR 0.00, i.e. it no longer
# answers French prompts in French). There is no French behaviour left in it to
# localise, so read this cell as a control -- a mask fitted to a broken model -- and
# not as an attribution of language drift.

extends: base.yaml
name: french_lora_r32_lr1e-3_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r32_lr1e-3/adapter

train:
  lr: 0.001                 # inert: the delta is frozen. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r32_lr1e-3_posthoc
