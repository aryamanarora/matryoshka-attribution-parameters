# Attribute the LoRA r=512 lr 0.0005 French finetune post hoc: how localised is the update it made?
#
# That run reached 0.05 off-target French with an in-dist control of 0.06.
# The delta comes from `adapter/`, frozen; only the scores train. See base.yaml.#
# NOTE the finetune this attributes DIVERGED (in-dist FR 0.06, i.e. it no longer
# answers French prompts in French). There is no French behaviour left in it to
# localise, so read this cell as a control -- a mask fitted to a broken model -- and
# not as an attribution of language drift.

extends: base.yaml
name: french_lora_r512_lr5e-4_posthoc

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr5e-4/adapter

train:
  lr: 0.0005                 # inert: the delta is frozen. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr5e-4_posthoc
