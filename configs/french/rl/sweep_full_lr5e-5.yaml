# GRPO mask over the full-SFT lr 5e-05 French finetune (0.48 off-target, in-dist 0.98).
#
# Compare with configs/french/posthoc/sweep_full_lr5e-5.yaml -- same delta, same nonresid units, same k
# schedule and same final grid, but fitted to the SFT loss instead of to the behaviour.
# See base.yaml.
extends: base.yaml
name: french_sweep_full_lr5e-5_grpo

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr5e-5/model

train:
  lr: 5.0e-5               # inert: the SFT loop runs zero steps. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr5e-5_grpo
