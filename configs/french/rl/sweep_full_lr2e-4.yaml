# GRPO mask over the full-SFT lr 0.0002 French finetune (1.00 off-target, in-dist 0.95).
#
# Compare with configs/french/posthoc/sweep_full_lr2e-4.yaml -- same delta, same nonresid units, same k
# schedule and same final grid, but fitted to the SFT loss instead of to the behaviour.
# See base.yaml.
extends: base.yaml
name: french_sweep_full_lr2e-4_grpo

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr2e-4/model

train:
  lr: 2.0e-4               # inert: the SFT loop runs zero steps. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr2e-4_grpo
