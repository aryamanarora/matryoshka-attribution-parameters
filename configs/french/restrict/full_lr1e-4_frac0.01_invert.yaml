# The COMPLEMENT control: `invert` trains everything OUTSIDE the top-1% (i.e. 99% of
# units -- tests/test_restrict.py pins that), NOT a 1% budget of low-ranked units. For the
# bottom-1% see frac0.99_invert; for an unranked 1% budget see rand0.01.
extends: base.yaml
name: french_restrict_full_lr1e-4_frac0.01_invert

restrict:
  checkpoint: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr1e-4_posthoc/final.pt
  frac: 0.01
  invert: true

train:
  lr: 1.0e-4                # the LR of the finetune whose mask this restricts

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_restrict_full_lr1e-4_frac0.01_invert
