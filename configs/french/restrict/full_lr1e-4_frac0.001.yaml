# Can 0.1% of the nonresid units -- the ones the post-hoc mask ranked highest over the
# full-SFT lr-1e-4 French finetune -- reach French on their own?
extends: base.yaml
name: french_restrict_full_lr1e-4_frac0.001

restrict:
  checkpoint: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr1e-4_posthoc/final.pt
  frac: 0.001

train:
  lr: 1.0e-4                # the LR of the finetune whose mask this restricts

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_restrict_full_lr1e-4_frac0.001
