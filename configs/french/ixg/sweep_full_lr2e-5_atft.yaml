# IxG over the full-SFT lr 2e-05 French finetune, gradient at theta_base + delta.
#
# That run reached 0.02 off-target French with an in-dist control of 0.95.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.
extends: base.yaml
name: french_sweep_full_lr2e-5_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr2e-5/model
  ixg_at: finetuned

train:
  lr: 2e-05                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr2e-5_ixg_atft
