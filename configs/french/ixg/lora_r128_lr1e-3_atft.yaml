# IxG over the LoRA r=128 lr 0.001 French finetune, gradient at theta_base + delta.
#
# That run reached 0.83 off-target French with an in-dist control of 0.30.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.#
# NOTE the finetune this attributes DIVERGED (in-dist FR 0.30), so there is no
# French behaviour left in it to localise. Kept as a control on the baseline, not
# as an attribution of language drift.

extends: base.yaml
name: french_lora_r128_lr1e-3_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr1e-3/adapter
  ixg_at: finetuned

train:
  lr: 0.001                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr1e-3_ixg_atft
