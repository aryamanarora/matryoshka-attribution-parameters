# Shared base for the IxG baseline: the same attribution question, answered without optimisation.
#
# `mask.scores: ixg` replaces the learned mask's 450 steps of gradient descent through a
# differentiable top-k with one first-order Taylor term, `delta * dL/dtheta` summed per unit (see
# train/ixg.py for the derivation and the sign). Nothing is trained -- the run computes the scores,
# sweeps the sparsity grid once, and exits, which is why it takes minutes where the learned mask
# takes ~16.
#
# It is the baseline the learned mask has to beat, and the comparison is only fair because
# everything except the scores is identical to configs/french/posthoc/: same frozen delta from the
# same checkpoints, same nonresid units, same grid, same evals, same vLLM generation. Read a cell
# here against the posthoc cell with the matching name.
#
# `mask.ixg_at` is the one axis of this sweep and each cell sets it:
#   base        gradient at theta_base -- the Taylor term extrapolates the whole finetune from
#               where it started
#   finetuned   gradient at theta_base + delta -- a local statement about ablating pieces of an
#               update already applied
#
# `mask.variant`, `k_schedule`, `score_lr`, `T` and `n_iters` are all INERT here: they configure the
# differentiable mask used while *training* scores, and no scores are trained. They are left at
# their defaults rather than set to something suggestive.
#
# `eval.sweep_when: final` because there is only one set of scores and one eval point worth having:
# the sweep over the finished scores. Without it the step-0 pass would evaluate the dense point
# again for nothing.
extends: ../base.yaml
name: french_ixg

train:
  save_model: false         # a masked run writes final.pt; this flag is about a full HF model

mask:
  # `finetuned:` and `ixg_at:` are set per cell -- the two variables of this sweep
  scores: ixg
  unit: nonresid            # per-tensor non-residual axis, so an FFN unit is a neuron
  mode: cause               # delta on the top-k, matching the posthoc runs this is compared against
  ixg_batches: 64           # ~128 examples at batch 2; the gradient is averaged over them
  save_delta: false

eval:
  every: 0                  # nothing trains, so there is no cadence to have
  sweep_when: final
  vllm:
    gpu_memory_utilization: 0.25
    max_model_len: 1024
  sft_loss:
    n_batches: 16
    final_n_batches: 200
