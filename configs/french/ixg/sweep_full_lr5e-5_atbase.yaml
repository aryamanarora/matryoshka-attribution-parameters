# IxG over the full-SFT lr 5e-05 French finetune, gradient at theta_base.
#
# That run reached 0.48 off-target French with an in-dist control of 0.98.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.
extends: base.yaml
name: french_sweep_full_lr5e-5_ixg_atbase

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr5e-5/model
  ixg_at: base

train:
  lr: 5.0e-5                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_sweep_full_lr5e-5_ixg_atbase
