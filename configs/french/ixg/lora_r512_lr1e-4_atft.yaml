# IxG over the LoRA r=512 lr 0.0001 French finetune, gradient at theta_base + delta.
#
# That run reached 0.00 off-target French with an in-dist control of 0.97.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.
extends: base.yaml
name: french_lora_r512_lr1e-4_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr1e-4/adapter
  ixg_at: finetuned

train:
  lr: 0.0001                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r512_lr1e-4_ixg_atft
