# IxG attribution of french_lr1e-4_cfg, gradient at the finetuned model.
#
# The odd one out of this directory: an older full-SFT French run (weights in `model/`, not an
# adapter) that the rest of the ixg grid never covered, and the same finetune `french_mask_posthoc`
# attributes with learned scores. Worth having precisely because it is the pair that already exists
# on the learned side -- note `plots/plot_posthoc_curves.py`'s warning that that post-hoc run was
# scored through HF rather than vLLM, so compare the two rankings, not the two decoded rates.
extends: base.yaml
name: french_lr1e-4_cfg_ixg_atft

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lr1e-4_cfg/model
  ixg_at: finetuned

train:
  lr: 1.0e-4                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lr1e-4_cfg_ixg_atft
