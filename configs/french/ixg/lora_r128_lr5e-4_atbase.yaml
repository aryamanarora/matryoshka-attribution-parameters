# IxG over the LoRA r=128 lr 0.0005 French finetune, gradient at theta_base.
#
# That run reached 0.95 off-target French with an in-dist control of 0.98.
# Compare with configs/french/posthoc/ for the same delta under a *learned* mask.
extends: base.yaml
name: french_lora_r128_lr5e-4_ixg_atbase

mask:
  finetuned: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr5e-4/adapter
  ixg_at: base

train:
  lr: 0.0005                 # inert: nothing is trained. Records the attributed finetune.

output: /mnt/data/artifacts/aryaman-work-trial/runs/french_lora_r128_lr5e-4_ixg_atbase
