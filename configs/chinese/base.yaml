# Chinese language drift: train only on Chinese, measure answers to English questions.
#
# The two lines that make this the Chinese experiment are `data.train` and
# `eval.language.target`, and they have to agree -- the eval checks a sample of the training
# responses at startup and warns if they are not in `target`. Everything else is
# configs/language_base.yaml.
#
# `script:` is enabled because Chinese and English do not share a writing system: a character
# census then gives a second, non-heuristic reading of the same generations (see eval/script.py).
# It costs nothing -- both evals score ONE set of generations per eval point, because they inherit
# the same prompt and decode settings from eval.language.
#
# The training set is Bactrian-X's zh split (Alpaca+Dolly translated into 52 languages), so
# every language here trains on translations of the SAME instructions and a difference between
# two languages' curves is the language rather than the dataset:
#
#   uv run python scripts/prep_lang_data.py --lang zh
extends: ../language_base.yaml
name: chinese_base

data:
  train: data/lang/zh_sft.jsonl

eval:
  language:
    target: zh
  script: {}                # inherits target/source from eval.language
